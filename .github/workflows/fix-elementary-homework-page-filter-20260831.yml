name: Fix elementary homework page filtering 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-elementary-homework-page-filter-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix dedicated elementary homework page
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('elementary-supabase.js','utf8');

          s=s.replace('  if (document.querySelector(".elementaryHomeworkListCard")) return;\n','');

          const oldSubjects='  const subjects = enrolledSubjects(dashboard);\n  list.insertAdjacentHTML(\'beforebegin\', `<form class="elementaryCustomHomeworkForm"><label>科目<select class="field elementaryCustomHomeworkSubject">${subjects.map((s) => `<option>${esc(s)}</option>`).join(\'\')}</select></label><label class="elementaryCustomHomeworkText">その他の宿題（任意）<input class="field" maxlength="120" placeholder="例：漢字ドリル p.20〜21"></label><button class="ghostBtn" type="submit">追加</button><small>必要なときだけ入力します。</small></form>`);';
          const newSubjects='  const subjects = enrolledSubjects(dashboard);\n  const dedicatedSubject = document.querySelector(".elementaryHomeworkListCard") ? normalizeSubject(document.getElementById("elementaryLessonSubject")?.value || "") : "";\n  const customSubjects = dedicatedSubject && subjects.includes(dedicatedSubject) ? [dedicatedSubject] : subjects;\n  list.insertAdjacentHTML(\'beforebegin\', `<form class="elementaryCustomHomeworkForm"><label>科目<select class="field elementaryCustomHomeworkSubject">${customSubjects.map((s) => `<option>${esc(s)}</option>`).join(\'\')}</select></label><label class="elementaryCustomHomeworkText">その他の宿題（任意）<input class="field" maxlength="120" placeholder="例：漢字ドリル p.20〜21"></label><button class="ghostBtn" type="submit">追加</button><small>必要なときだけ入力します。</small></form>`);';
          if(!s.includes(oldSubjects)) throw new Error('custom homework form source not found');
          s=s.replace(oldSubjects,newSubjects);

          const oldRows='  const rows = (data?.homework || []).filter((r) => String(r.series || "").startsWith("ELEMENTARY:"));\n  const signature = rows.map((r) => [r.homework_id, r.updated_at, r.student_status, r.teacher_status, r.archived_at].join("|")).join(";") || "empty";';
          const newRows='  let rows = (data?.homework || []).filter((r) => String(r.series || "").startsWith("ELEMENTARY:"));\n  const dedicatedSubject = document.querySelector(".elementaryHomeworkListCard") ? normalizeSubject(document.getElementById("elementaryLessonSubject")?.value || "") : "";\n  if (dedicatedSubject) rows = rows.filter((r) => normalizeSubject(String(r.series || "").replace(/^ELEMENTARY:/, "")) === dedicatedSubject);\n  const signature = `${dedicatedSubject}|${rows.map((r) => [r.homework_id, r.updated_at, r.student_status, r.teacher_status, r.archived_at].join("|")).join(";") || "empty"}`;';
          if(!s.includes(oldRows)) throw new Error('homework row filter source not found');
          s=s.replace(oldRows,newRows);

          fs.writeFileSync('elementary-supabase.js',s);

          const p='tests/role-colors-homework-navigation.test.mjs';
          let t=fs.readFileSync(p,'utf8');
          t=t.split('\n').filter((line) => !line.includes('assert.match(elementary, /if \\(document\\.querySelector\\("\\.elementaryHomeworkListCard"\\)\\) return/);')).join('\n');
          if(!t.includes('dedicatedSubject = document.querySelector(".elementaryHomeworkListCard")')) {
            t += `\nassert.ok(!elementary.includes('if (document.querySelector(".elementaryHomeworkListCard")) return;'));\nassert.ok(elementary.includes('const dedicatedSubject = document.querySelector(".elementaryHomeworkListCard") ? normalizeSubject(document.getElementById("elementaryLessonSubject")?.value || "") : "";'));\nassert.ok(elementary.includes('if (dedicatedSubject) rows = rows.filter'));\nassert.ok(elementary.includes('const customSubjects = dedicatedSubject && subjects.includes(dedicatedSubject) ? [dedicatedSubject] : subjects;'));\nassert.ok(elementary.includes('教科書漢字ドリルなど'));\n`;
          }
          fs.writeFileSync(p,t);

          let index=fs.readFileSync('index.html','utf8');
          index=index.replace(/elementary-supabase\.js\?v=[^\"']+/g,'elementary-supabase.js?v=20260831-homework-page-filter-1');
          fs.writeFileSync('index.html',index);
          NODE
      - name: Validate
        run: |
          node --check elementary-supabase.js
          node --check tests/role-colors-homework-navigation.test.mjs
          npm test
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-supabase.js index.html tests/role-colors-homework-navigation.test.mjs
          git commit -m "Fix elementary homework page subject filtering" || exit 0
          git push origin HEAD:main
