name: Fix elementary admin progress 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-elementary-admin-progress-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use elementary progression in admin student detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          elem_path = Path('elementary-supabase.js')
          audit_path = Path('tests/elementary-spec-audit.test.mjs')
          index_path = Path('index.html')

          app = app_path.read_text()
          elem = elem_path.read_text()
          audit = audit_path.read_text()
          index = index_path.read_text()

          start = app.find('async function renderAdminStudent(')
          end = app.find('async function renderRangeSettings(', start)
          if start < 0 or end < 0:
              raise SystemExit('renderAdminStudent section not found')
          section = app[start:end]

          old_decl = '    const s = data.student, summary = homeworkSummary(data.homework || []);\n'
          new_decl = '''    const s = data.student, summary = homeworkSummary(data.homework || []);\n    const elementaryAdmin = isElementaryGradeValue(s.grade);\n    const elementaryAdminSubjects = elementaryAdmin ? elementaryCoreRows(data).map((row) => row.subject) : [];\n    const adminProgressActions = elementaryAdmin\n      ? elementaryAdminSubjects.map((subject) => `<button class="secondaryBtn adminElementaryProgress" data-subject="${esc(subject)}">${esc(subject)}の進行表</button>`).join("")\n      : `${TRACKED_SUBJECTS.map((subject) => `<button class="secondaryBtn adminProgress" data-subject="${subject}">${subject}の進行表</button>`).join("")}<a class="ghostBtn" href="${CONFIG.scoreCorrectionUrl}" target="_blank" rel="noopener">成績を訂正する ↗</a>`;\n'''
          if old_decl not in section:
              raise SystemExit('admin declaration anchor not found')
          section = section.replace(old_decl, new_decl, 1)

          old_actions = '<div class="actionRow">${TRACKED_SUBJECTS.map((subject) => `<button class="secondaryBtn adminProgress" data-subject="${subject}">${subject}の進行表</button>`).join("")}<a class="ghostBtn" href="${CONFIG.scoreCorrectionUrl}" target="_blank" rel="noopener">成績を訂正する ↗</a></div>'
          if old_actions not in section:
              raise SystemExit('admin header action source not found')
          section = section.replace(old_actions, '<div class="actionRow">${adminProgressActions}</div>', 1)

          old_bind = '    $("content").querySelectorAll(".adminProgress").forEach((button) => button.onclick = () => openProgress({ studentId, subject: button.dataset.subject, mode: "view" }));\n'
          new_bind = '''    if (elementaryAdmin) {\n      $("content").querySelectorAll(".adminElementaryProgress").forEach((button) => button.onclick = () => {\n        window.dispatchEvent(new CustomEvent("foresta:open-elementary-admin-progress", { detail: { studentId, subject: button.dataset.subject, grade: s.grade || "", englishLevel: s.englishLevel || "", subjects: elementaryAdminSubjects } }));\n      });\n    } else {\n      $("content").querySelectorAll(".adminProgress").forEach((button) => button.onclick = () => openProgress({ studentId, subject: button.dataset.subject, mode: "view" }));\n    }\n'''
          if old_bind not in section:
              raise SystemExit('admin progress binding source not found')
          section = section.replace(old_bind, new_bind, 1)
          app = app[:start] + section + app[end:]

          event_marker = 'foresta:open-elementary-admin-progress'
          if event_marker not in elem:
              anchor = 'let homeworkOnlyEnhancing = false;'
              if anchor not in elem:
                  raise SystemExit('elementary event insertion anchor not found')
              handler = '''window.addEventListener("foresta:open-elementary-admin-progress", async (event) => {\n  const detail = event.detail || {};\n  const subject = normalizeSubject(detail.subject);\n  if (!CORE.includes(subject)) return;\n  const previousDashboard = lastDashboard;\n  lastDashboard = { student: { studentId: String(detail.studentId || pageStudentId() || ""), grade: String(detail.grade || ""), englishLevel: String(detail.englishLevel || ""), subjects: Array.isArray(detail.subjects) ? detail.subjects : [] } };\n  try {\n    await showInteractiveProgression(subject, false);\n  } catch (error) {\n    status(error.message, true);\n  } finally {\n    lastDashboard = previousDashboard;\n  }\n});\n\n'''
              elem = elem.replace(anchor, handler + anchor, 1)

          if 'adminElementaryProgress' not in audit:
              audit += '''\nassert.ok(app.includes('adminElementaryProgress'));\nassert.ok(app.includes('foresta:open-elementary-admin-progress'));\nassert.ok(app.includes('const elementaryAdmin = isElementaryGradeValue(s.grade)'));\nassert.ok(app.includes('const adminProgressActions = elementaryAdmin'));\nassert.ok(elem.includes('window.addEventListener("foresta:open-elementary-admin-progress"'));\n'''

          index = re.sub(r'app\.js\?v=[^\"\']+', 'app.js?v=20260831-elementary-admin-progress-1', index)
          index = re.sub(r'elementary-supabase\.js\?v=[^\"\']+', 'elementary-supabase.js?v=20260831-elementary-admin-progress-1', index)

          app_path.write_text(app)
          elem_path.write_text(elem)
          audit_path.write_text(audit)
          index_path.write_text(index)
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check tests/elementary-spec-audit.test.mjs
          grep -F 'adminElementaryProgress' app.js
          grep -F 'foresta:open-elementary-admin-progress' elementary-supabase.js
          npm test
          git diff --check
      - name: Commit validated fix and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-elementary-admin-progress-20260831.yml
          git rm -f .github/workflows/fix-elementary-note-admin-layout-20260831.yml || true
          git add app.js elementary-supabase.js index.html tests/elementary-spec-audit.test.mjs
          git commit -m "Use elementary progress in admin detail" || exit 0
          git push origin HEAD:main
