name: Fix elementary card history switch cache
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-elementary-card-history-switch-cache.py
      - .github/workflows/fix-elementary-card-history-switch-cache.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-elementary-card-history-switch-cache.py
      - run: node --check app.js
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js elementary-supabase.js elementary-supabase.css index.html
          git commit -m "Remove duplicate test line, emphasize scores, and cache student switches"
          git push origin HEAD:main
