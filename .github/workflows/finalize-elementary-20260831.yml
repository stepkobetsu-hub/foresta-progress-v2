name: Finalize elementary 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-elementary-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/finalize-elementary-20260831.mjs
      - name: Validate JavaScript
        run: |
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-supabase.js
          git commit -m "Finalize elementary labels and auto homework"
          git push origin HEAD:main
