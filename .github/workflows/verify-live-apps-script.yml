name: Verify live Apps Script deployment

on:
  push:
    branches: [main]
    paths:
      - verify-live-trigger.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployed API and record result
        shell: bash
        run: |
          set -u
          API='https://script.google.com/macros/s/AKfycbz0z2FeM1jWUSs7LTzwi9N12kPoTmSTP_hRjTaf3wQlf5kX5hR_W9E37ON63L_dhbIZ/exec'

          GET_BODY="$(curl -L --fail-with-body -sS "$API" 2>&1)"
          GET_CODE=$?
          HEALTH="$(curl -L --fail-with-body -sS -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"health"}' "$API" 2>&1)"
          HEALTH_CODE=$?
          ARCHIVE="$(curl -L --fail-with-body -sS -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"archiveHomework","homeworkIds":["VERIFY_ONLY"]}' "$API" 2>&1)"
          ARCHIVE_CODE=$?
          RESTORE="$(curl -L --fail-with-body -sS -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"restoreHomework","homeworkIds":["VERIFY_ONLY"]}' "$API" 2>&1)"
          RESTORE_CODE=$?
          DELETE="$(curl -L --fail-with-body -sS -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"deleteHomework","homeworkIds":["VERIFY_ONLY"]}' "$API" 2>&1)"
          DELETE_CODE=$?

          RESULT='UNEXPECTED'
          if [ "$GET_CODE" -ne 0 ] || [ "$HEALTH_CODE" -ne 0 ] || [ "$ARCHIVE_CODE" -ne 0 ] || [ "$RESTORE_CODE" -ne 0 ] || [ "$DELETE_CODE" -ne 0 ]; then
            RESULT='NETWORK_ERROR'
          elif ! echo "$GET_BODY" | grep -q '"version":"2.3.1"'; then
            RESULT='OLD_VERSION'
          elif echo "$ARCHIVE$RESTORE$DELETE" | grep -q '処理を実行できません'; then
            RESULT='OLD_ARCHIVE_API'
          elif echo "$ARCHIVE" | grep -q 'ログインの有効期限が切れました' && echo "$RESTORE" | grep -q 'ログインの有効期限が切れました' && echo "$DELETE" | grep -q 'ログインの有効期限が切れました'; then
            RESULT='V2_3_1_SELF_DELETE_DEPLOYED'
          fi

          cat > LIVE_VERIFY_RESULT.txt <<EOF
          result=$RESULT
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          get=$GET_BODY
          health=$HEALTH
          archive=$ARCHIVE
          restore=$RESTORE
          delete=$DELETE
          EOF

          cat LIVE_VERIFY_RESULT.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_VERIFY_RESULT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record live v2.3.1 verification"
            git push origin HEAD:main
          fi
