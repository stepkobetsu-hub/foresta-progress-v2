name: Verify Foresta V3 fast runtime
on:
  push:
    branches: [agent/foresta-v3-fast-runtime-20260831]
    paths:
      - .github/workflows/verify-fast-runtime-v3.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify health and measure latency
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wisedgcgwaebtkprdhth.supabase.co/functions/v1/foresta-runtime-v3-staging"
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error -o "/tmp/health-$i.json" -w "run=$i http=%{http_code} total=%{time_total}s ttfb=%{time_starttransfer}s\n" "$URL"
            cat "/tmp/health-$i.json"
            echo
            node -e "const h=require('/tmp/health-$i.json'); if(h.ok!==true || h.mode!=='supabase-fast-runtime-staging') process.exit(1)"
          done
