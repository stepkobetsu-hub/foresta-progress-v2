name: Run Foresta V3 authenticated smoke
on:
  push:
    branches: [agent/foresta-v3-fast-runtime-20260831]
    paths:
      - .github/workflows/run-v3-smoke-20260831.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run isolated dummy smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wisedgcgwaebtkprdhth.supabase.co/functions/v1/foresta-v3-smoke-20260831"
          curl --fail --silent --show-error "$URL" | tee /tmp/result.json
          echo
          node - <<'NODE'
          const r=require('/tmp/result.json');
          if(r.ok!==true) process.exit(1);
          if(r.dashboard2?.fast?.cacheHit!==true) process.exit(2);
          if(r.progression2?.fast?.cacheHit!==true) process.exit(3);
          if(r.homeworkWrite && r.homeworkWrite.value?.queued!==true) process.exit(4);
          NODE
