name: Force elementary teacher controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-elementary-teacher-controls.yml
      - scripts/force-elementary-teacher-controls.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/force-elementary-teacher-controls.py
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js index.html
          git commit -m "Force elementary teacher controls from teacher progress button"
          git push origin HEAD:main
