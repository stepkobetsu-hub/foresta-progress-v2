name: Persist teacher lesson selection
on:
  push:
    branches: [main]
    paths:
      - scripts/persist-teacher-lesson-selection.py
      - .github/workflows/persist-teacher-lesson-selection.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/persist-teacher-lesson-selection.py
      - run: node --check app.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css index.html
          git commit -m "Persist selected students until lesson ends and show active role"
          git push origin HEAD:main
