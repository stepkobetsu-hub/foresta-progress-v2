name: Apply 2026-08-23 three-round backend update

on:
  pull_request:
    branches: [main]
    paths:
      - rounds-pr-trigger-20260823.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-rounds-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded round patch
        run: node scripts/apply-20260823-rounds-v2.mjs

      - name: Run existing tests
        run: npm test

      - name: Parse-check browser JavaScript
        run: node --check app.js

      - name: Parse-check Apps Script
        run: cp apps-script/Code.gs /tmp/foresta-code.js && node --check /tmp/foresta-code.js

      - name: Commit verified source files to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js styles.css apps-script/Code.gs; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css apps-script/Code.gs
          git commit -m "Add three-round progress and range override flow"
          git push origin HEAD:${{ github.head_ref }}
