name: Apply 2026-08-22 progress usability update

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-20260822-usability.mjs

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-usability-20260822
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded patch
        run: node scripts/apply-20260822-usability.mjs

      - name: Run existing tests
        run: npm test

      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html app.js styles.css; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git commit -m "Improve progress table usability and autosave"
          git push origin HEAD:main
