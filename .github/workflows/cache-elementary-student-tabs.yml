name: Cache elementary student tabs
on:
  push:
    branches: [main]
    paths:
      - scripts/cache-elementary-student-tabs.py
      - .github/workflows/cache-elementary-student-tabs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/cache-elementary-student-tabs.py
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js index.html
          git commit -m "Cache elementary data per opened student tab"
          git push origin HEAD:main
