name: Cleanup Foresta V3 temp files
on:
  push:
    branches: [agent/foresta-v3-fast-runtime-20260831]
    paths:
      - .github/workflows/cleanup-v3-temp.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foresta-v3-fast-runtime-20260831
          fetch-depth: 0
      - name: Remove temporary patch and smoke files
        run: |
          rm -f \
            scripts/apply-fast-runtime-v3.py \
            scripts/bump-fast-v3-cache.py \
            scripts/enhance-fast-v3-client.py \
            .github/workflows/apply-fast-runtime-v3.yml \
            .github/workflows/bump-fast-v3-cache.yml \
            .github/workflows/enhance-fast-v3-client.yml \
            .github/workflows/verify-fast-runtime-v3.yml \
            .github/workflows/run-v3-smoke-20260831.yml \
            .github/workflows/cleanup-v3-temp.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary V3 staging helpers"
          git push origin HEAD:agent/foresta-v3-fast-runtime-20260831
