name: Apply science and social progressions 2026-08-23

on:
  push:
    branches: [main]
    paths:
      - science-social-trigger.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-science-social
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded update
        run: node scripts/apply-20260823-science-social.mjs
      - name: Run existing tests
        run: npm test
      - name: Parse-check browser JavaScript
        run: node --check app.js && node --check domain.js
      - name: Parse-check Apps Script
        shell: bash
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Verify unit data
        shell: bash
        run: |
          test "$(wc -l < data/science-social-units.tsv)" -eq 368
          grep -q $'^sci-g1-tosho-' data/science-social-units.tsv
          grep -q $'^soc-civics-tosho-' data/science-social-units.tsv
      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- domain.js app.js styles.css index.html apps-script/Code.gs data/science-social-units.tsv; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain.js app.js styles.css index.html apps-script/Code.gs data/science-social-units.tsv
          git commit -m "Add science and social progressions"
          git push origin HEAD:main
