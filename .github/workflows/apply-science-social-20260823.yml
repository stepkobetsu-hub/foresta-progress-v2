name: Apply science and social progressions 2026-08-23

on:
  push:
    branches: [main]
    paths:
      - science-social-trigger.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-science-social
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply complete source import update
        run: node scripts/upgrade-20260823-science-social-v2.mjs
      - name: Run existing tests
        run: npm test
      - name: Parse-check browser JavaScript
        run: node --check app.js && node --check domain.js
      - name: Parse-check Apps Script
        shell: bash
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Verify science/social hooks
        shell: bash
        run: |
          grep -q '理科.*社会' domain.js
          grep -q 'FORESTA_SCI_SOC_UNITS_V2' apps-script/Code.gs
          grep -q "version: '2.2.0'" apps-script/Code.gs
          grep -q 'TRACKED_SUBJECTS.map((subject)' app.js
          grep -q 'SCI_SOC_MASTER_COUNT_' apps-script/Code.gs
      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js index.html apps-script/Code.gs; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html apps-script/Code.gs
          git commit -m "Complete science and social source import"
          git push origin HEAD:main
