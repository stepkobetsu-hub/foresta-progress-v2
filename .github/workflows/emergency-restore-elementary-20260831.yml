name: Finalize elementary recovery 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-restore-elementary-20260831.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore finalized elementary behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('elementary-supabase.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'return \'<option value="">大きな単元（章）を選ぶ</option>\' + groups.map',
              'return \'<option value="">単元（章）を選ぶ</option>\' + groups.map'
          )
          s = s.replace(
              'output.textContent = "大きな単元（章）を選んでください。";',
              'output.textContent = "単元（章）を選んでください。";'
          )

          old = '''        } else {
          // Match the middle-school flow: selecting today's progress does not finalize homework yet.
          // Clear the temporary defaults created by the compatibility endpoint; the confirmation screen
          // starts with the normal presets checked and the teacher decides what to keep.
          result = await callElementary("configureHomework", { subject: normalized, unitId: input.dataset.unit, lessonDate: today, selectedTypes: [], other: "" });
          status("今日の進行を保存しました。『次回宿題を確認・調整』で宿題を確認して保存してください。");
        }'''
          new = '''        } else {
          const selectedTypes = normalized === "国語" ? ["TODAY_REDO"] : ["TRY_REDO", "EXERCISE"];
          result = await callElementary("configureHomework", { subject: normalized, unitId: input.dataset.unit, lessonDate: today, selectedTypes, other: "" });
          status(normalized === "国語"
            ? "今日の進行と『本日の赤×なおし』を宿題に保存しました。"
            : "今日の進行と『TRYの赤×なおし・エクササイズ』を宿題に保存しました。");
        }'''
          if old not in s:
              raise SystemExit('expected checked-today block not found')
          s = s.replace(old, new, 1)

          if '単元（章）を選ぶ</option>' not in s:
              raise SystemExit('chapter selector label patch failed')
          if 'selectedTypes = normalized === "国語"' not in s:
              raise SystemExit('auto homework patch failed')
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
          grep -q '単元（章）を選ぶ</option>' elementary-supabase.js
          grep -q 'selectedTypes = normalized === "国語"' elementary-supabase.js
          grep -q 'progress.textContent !== "進行表を開く"' v3-homework-ui-fix.js
          grep -q 'v3-homework-ui-fix.js?v=20260831-safe-buttons-1' index.html
      - name: Commit finalized recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-supabase.js
          git commit -m "Restore finalized elementary labels and auto homework"
          git push origin HEAD:main
