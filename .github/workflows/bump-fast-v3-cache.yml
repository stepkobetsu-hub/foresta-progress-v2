name: Bump Foresta V3 staging cache
on:
  push:
    branches: [agent/foresta-v3-fast-runtime-20260831]
    paths:
      - scripts/bump-fast-v3-cache.py
      - .github/workflows/bump-fast-v3-cache.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foresta-v3-fast-runtime-20260831
          fetch-depth: 0
      - run: python scripts/bump-fast-v3-cache.py
      - run: node --check app.js
      - run: npm test
      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m "Bump opt-in V3 staging assets" || exit 0
          git push origin HEAD:agent/foresta-v3-fast-runtime-20260831
