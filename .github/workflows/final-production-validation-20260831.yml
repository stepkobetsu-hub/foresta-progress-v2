name: Final production validation 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-production-validation-20260831.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore Japanese placeholder and align tests
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'elementary-supabase.js';
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes('教科書漢字ドリルなど')) {
            const marker = "  const form = list.parentElement.querySelector('.elementaryCustomHomeworkForm');\n  form.onsubmit = async (event) => {";
            const replacement = "  const form = list.parentElement.querySelector('.elementaryCustomHomeworkForm');\n  const customSubject = form.querySelector('.elementaryCustomHomeworkSubject');\n  const customInput = form.querySelector('.elementaryCustomHomeworkText input');\n  const updateCustomHomeworkPlaceholder = () => {\n    customInput.placeholder = normalizeSubject(customSubject.value) === \"国語\" ? \"教科書漢字ドリルなど\" : \"例：漢字ドリル p.20〜21\";\n  };\n  customSubject.addEventListener('change', updateCustomHomeworkPlaceholder);\n  updateCustomHomeworkPlaceholder();\n  form.onsubmit = async (event) => {";
            if (!s.includes(marker)) throw new Error('custom homework form marker not found');
            s = s.replace(marker, replacement);
            fs.writeFileSync(path, s);
          }

          const testPath = 'tests/admin-elementary-summary.test.mjs';
          let t = fs.readFileSync(testPath, 'utf8');
          t = t.replace('assert.match(html, /app\\.js\\?v=20260831-admin-progress-1/);', 'assert.match(html, /app\\.js\\?v=20260831-core-recovery-1/);');
          fs.writeFileSync(testPath, t);
          NODE
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
          node --check elementary-session-fix.js
      - name: Required production behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const elem = fs.readFileSync('elementary-supabase.js','utf8');
          const buttons = fs.readFileSync('v3-homework-ui-fix.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const checks = [
            ['chapter label', elem, '単元（章）を選ぶ</option>'],
            ['Japanese homework placeholder', elem, '教科書漢字ドリルなど'],
            ['auto homework', elem, 'selectedTypes = normalized === "国語" ? ["TODAY_REDO"] : ["TRY_REDO", "EXERCISE"]'],
            ['save result reuse', elem, 'dataOverride || await loadElementaryData(true)'],
            ['safe observer button patch', buttons, 'progress.textContent !== "進行表を開く"'],
            ['two-button UI', buttons, '次回宿題を確認・調整'],
            ['final cache version', index, 'elementary-supabase.js?v=20260831-final-1'],
          ];
          const missing = checks.filter(([,haystack,needle]) => !haystack.includes(needle)).map(([name]) => name);
          if (missing.length) { console.error('Missing:', missing.join(', ')); process.exit(1); }
          console.log('Required production behavior: OK');
          NODE
      - name: Full tests
        run: npm test
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-supabase.js tests/admin-elementary-summary.test.mjs
          if git diff --cached --quiet; then
            echo "No repair changes needed."
          else
            git commit -m "Restore Japanese homework hint and align validation"
            git push origin HEAD:main
          fi
