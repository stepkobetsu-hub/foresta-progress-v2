name: Final production validation 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-production-validation-20260831.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
          node --check elementary-session-fix.js
      - name: Required production behavior
        run: |
          grep -Fq '単元（章）を選ぶ</option>' elementary-supabase.js
          grep -Fq '教科書漢字ドリルなど' elementary-supabase.js
          grep -Fq 'selectedTypes = normalized === "国語" ? ["TODAY_REDO"] : ["TRY_REDO", "EXERCISE"]' elementary-supabase.js
          grep -Fq 'dataOverride || await loadElementaryData(true)' elementary-supabase.js
          grep -Fq 'progress.textContent !== "進行表を開く"' v3-homework-ui-fix.js
          grep -Fq '次回宿題を確認・調整' v3-homework-ui-fix.js
          grep -Fq 'elementary-supabase.js?v=20260831-final-1' index.html
      - name: Full tests
        run: npm test
