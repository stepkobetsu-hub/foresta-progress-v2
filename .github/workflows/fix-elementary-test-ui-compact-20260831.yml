name: Fix compact elementary test UI 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-elementary-test-ui-compact-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compact elementary unit test score UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          elem_path = Path('elementary-supabase.js')
          supa_css_path = Path('elementary-supabase.css')
          teacher_css_path = Path('elementary-teacher-layout-fix.css')
          index_path = Path('index.html')
          audit_path = Path('tests/elementary-spec-audit.test.mjs')
          admin_path = Path('tests/admin-elementary-summary.test.mjs')

          app = app_path.read_text()
          elem = elem_path.read_text()
          supa_css = supa_css_path.read_text()
          teacher_css = teacher_css_path.read_text()
          index = index_path.read_text()
          audit = audit_path.read_text()
          admin = admin_path.read_text()

          note = '※裏面がないテストは、裏面の点数・満点は空欄でかまいません。'

          # Top teacher form: restore compact label and put the explanation below the score boxes.
          long_top = '裏面の点数（ない場合は空欄）<input id="elementaryTopTestBackScore"'
          short_top = '裏面の点数<input id="elementaryTopTestBackScore"'
          if long_top not in app:
              raise SystemExit('top long back-score label not found')
          app = app.replace(long_top, short_top, 1)
          top_anchor = '<label class="elementaryBackMax">裏面の満点<input id="elementaryTopTestBackMax" class="field" type="number" min="1" max="999" value="50"></label><label class="elementaryTopTestDate">'
          top_repl = '<label class="elementaryBackMax">裏面の満点<input id="elementaryTopTestBackMax" class="field" type="number" min="1" max="999" value="50"></label><small class="elementaryBackScoreNote">' + note + '</small><label class="elementaryTopTestDate">'
          if top_anchor not in app:
              raise SystemExit('top back-max anchor not found')
          app = app.replace(top_anchor, top_repl, 1)

          # Progression dialog: same compact label and one note below all four score inputs.
          long_dialog = '裏面の点数（ない場合は空欄）<input id="eTestBackScore"'
          short_dialog = '裏面の点数<input id="eTestBackScore"'
          if long_dialog not in elem:
              raise SystemExit('dialog long back-score label not found')
          elem = elem.replace(long_dialog, short_dialog, 1)
          dialog_anchor = '</div></fieldset></div><label>メモ<input id="eTestMemo"'
          dialog_repl = '</div></fieldset></div><small class="elementaryBackScoreNote">' + note + '</small><label>メモ<input id="eTestMemo"'
          if dialog_anchor not in elem:
              raise SystemExit('dialog score-group anchor not found')
          elem = elem.replace(dialog_anchor, dialog_repl, 1)

          # Smaller one-line score labels, with the explanatory line below.
          supa_rule = '''\n/* Compact elementary unit-test score labels. */\n.elementaryUnitTestDialogCard .elementaryScoreInputs label{font-size:.68rem!important;line-height:1.1!important;white-space:nowrap!important;gap:4px!important}\n.elementaryUnitTestDialogCard .elementaryBackScoreNote{display:block;font-size:.64rem;line-height:1.35;color:#74827e;margin:-2px 0 0;padding:0 2px}\n'''
          if 'Compact elementary unit-test score labels.' not in supa_css:
              supa_css += supa_rule

          teacher_rule = '''\n/* Keep the four elementary unit-test score labels compact. */\n.elementaryTopTestForm .elementaryFrontScore,.elementaryTopTestForm .elementaryFrontMax,.elementaryTopTestForm .elementaryBackScore,.elementaryTopTestForm .elementaryBackMax{font-size:.62rem!important;line-height:1.05!important;white-space:nowrap!important}\n.elementaryTopTestForm .elementaryBackScoreNote{grid-column:5/span 2;align-self:start;margin-top:-2px;font-size:.59rem;line-height:1.25;color:#74827e;white-space:nowrap}\n@media(max-width:900px){.elementaryTopTestForm .elementaryBackScoreNote{grid-column:1/-1;white-space:normal;margin-top:0}}\n'''
          if 'Keep the four elementary unit-test score labels compact.' not in teacher_css:
              teacher_css += teacher_rule

          # Update permanent audits to lock the requested presentation.
          audit = audit.replace("assert.ok(app.includes('裏面の点数（ない場合は空欄）<input id=\"elementaryTopTestBackScore\"'));", "assert.ok(app.includes('裏面の点数<input id=\"elementaryTopTestBackScore\"'));", 1)
          audit = audit.replace("assert.ok(elem.includes('裏面の点数（ない場合は空欄）<input id=\"eTestBackScore\"'));", "assert.ok(elem.includes('裏面の点数<input id=\"eTestBackScore\"'));", 1)
          if note not in audit:
              audit += f"\nassert.ok(app.includes('{note}'));\nassert.ok(elem.includes('{note}'));\n"
          if "裏面の点数（ない場合は空欄）" not in audit:
              audit += "assert.ok(!app.includes('裏面の点数（ない場合は空欄）'));\nassert.ok(!elem.includes('裏面の点数（ない場合は空欄）'));\n"

          admin = admin.replace('assert.match(app, /裏面の点数（ない場合は空欄）<input id="elementaryTopTestBackScore"[^>]*value="30"/);', 'assert.match(app, /裏面の点数<input id="elementaryTopTestBackScore"[^>]*value="30"/);', 1)
          if note not in admin:
              admin += f"\nassert.ok(app.includes('{note}'));\n"

          # Cache bust all touched browser assets.
          index = re.sub(r'app\.js\?v=[^\"\']+', 'app.js?v=20260831-compact-test-ui-1', index)
          index = re.sub(r'elementary-supabase\.js\?v=[^\"\']+', 'elementary-supabase.js?v=20260831-compact-test-ui-1', index)
          index = re.sub(r'elementary-supabase\.css\?v=[^\"\']+', 'elementary-supabase.css?v=20260831-compact-test-ui-1', index)
          index = re.sub(r'elementary-teacher-layout-fix\.css\?v=[^\"\']+', 'elementary-teacher-layout-fix.css?v=20260831-compact-test-ui-1', index)

          app_path.write_text(app)
          elem_path.write_text(elem)
          supa_css_path.write_text(supa_css)
          teacher_css_path.write_text(teacher_css)
          index_path.write_text(index)
          audit_path.write_text(audit)
          admin_path.write_text(admin)
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check tests/elementary-spec-audit.test.mjs
          node --check tests/admin-elementary-summary.test.mjs
          npm test
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js elementary-supabase.js elementary-supabase.css elementary-teacher-layout-fix.css index.html tests/elementary-spec-audit.test.mjs tests/admin-elementary-summary.test.mjs
          git commit -m "Compact elementary unit test score labels" || exit 0
          git push origin HEAD:main
