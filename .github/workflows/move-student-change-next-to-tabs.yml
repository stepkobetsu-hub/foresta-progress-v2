name: Move student change beside selected tabs
on:
  push:
    branches: [main]
    paths:
      - scripts/move-student-change-next-to-tabs.py
      - .github/workflows/move-student-change-next-to-tabs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/move-student-change-next-to-tabs.py
      - run: node --check app.js
      - run: npm test
      - name: Commit student change placement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css index.html
          git commit -m "Move student change button beside selected students"
          git push origin HEAD:main
