name: Elementary specification audit retry 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/elementary-spec-audit-retry-20260831.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch audited elementary omissions
        run: |
          node <<'NODE'
          const fs = require('fs');
          let elem = fs.readFileSync('elementary-supabase.js', 'utf8');
          elem = elem.replace(
            `  const customSubject = form.querySelector('.elementaryCustomHomeworkSubject');\n  const customInput = form.querySelector('.elementaryCustomHomeworkText input');\n  const updateCustomHomeworkPlaceholder = () => {\n    customInput.placeholder = normalizeSubject(customSubject.value) === "国語" ? "教科書漢字ドリルなど" : "例：漢字ドリル p.20〜21";\n  };\n  customSubject.addEventListener('change', updateCustomHomeworkPlaceholder);\n  updateCustomHomeworkPlaceholder();`,
            `  const customSubject = form.querySelector('.elementaryCustomHomeworkSubject');\n  const customInput = form.querySelector('.elementaryCustomHomeworkText input');\n  const lessonSubjectSelect = document.getElementById("elementaryLessonSubject");\n  const updateCustomHomeworkPlaceholder = () => {\n    customInput.placeholder = normalizeSubject(customSubject.value) === "国語" ? "教科書漢字ドリルなど" : "例：漢字ドリル p.20〜21";\n  };\n  const syncCustomHomeworkSubject = () => {\n    const lessonSubject = normalizeSubject(lessonSubjectSelect?.value || "");\n    if (lessonSubject && subjects.includes(lessonSubject)) customSubject.value = lessonSubject;\n    updateCustomHomeworkPlaceholder();\n  };\n  customSubject.addEventListener('change', updateCustomHomeworkPlaceholder);\n  lessonSubjectSelect?.addEventListener('change', syncCustomHomeworkSubject);\n  syncCustomHomeworkSubject();`
          );
          if (!elem.includes('const otherPlaceholder = normalized === "国語" ? "教科書漢字ドリルなど"')) {
            elem = elem.replace(
              `  if (!selectedUnits.length) { status("今回進んだ単元を1つ以上選んでください。", true); return; }\n  const groups = selectedUnits.map((unit, index) => {`,
              `  if (!selectedUnits.length) { status("今回進んだ単元を1つ以上選んでください。", true); return; }\n  const otherPlaceholder = normalized === "国語" ? "教科書漢字ドリルなど" : "この単元だけのその他の宿題（必要な場合）";\n  const groups = selectedUnits.map((unit, index) => {`
            );
          }
          elem = elem.replace('placeholder="この単元だけのその他の宿題（必要な場合）"', 'placeholder="${esc(otherPlaceholder)}"');
          elem = elem.replace('<legend>表面</legend>', '<legend class="hidden">表面</legend>');
          elem = elem.replace('<label>点数<input id="eTestScore" class="field" type="number" min="0" max="999" autofocus>', '<label>表面の点数<input id="eTestScore" class="field" type="number" min="0" max="999" value="50" autofocus>');
          elem = elem.replace('<label>満点<input id="eTestMax" class="field" type="number" min="1" max="999" value="100">', '<label>表面の満点<input id="eTestMax" class="field" type="number" min="1" max="999" value="100">');
          elem = elem.replace('<legend>裏面</legend>', '<legend class="hidden">裏面</legend>');
          elem = elem.replace('<label>点数<input id="eTestBackScore" class="field" type="number" min="0" max="999">', '<label>裏面の点数<input id="eTestBackScore" class="field" type="number" min="0" max="999" value="30">');
          elem = elem.replace('<label>満点<input id="eTestBackMax" class="field" type="number" min="1" max="999" value="50">', '<label>裏面の満点<input id="eTestBackMax" class="field" type="number" min="1" max="999" value="50">');
          elem = elem.replace('      scoreEl.value = "";\n      backScoreEl.value = "";', '      scoreEl.value = "50";\n      backScoreEl.value = "30";');
          if (!elem.includes('const chapterLabel = /^\\d+$/u.test(raw)')) {
            elem = elem.replace(
              `    if (!groups.has(raw)) {\n      groups.set(raw, {\n        key: raw,\n        unitId: \`chapter:\${normalizeSubject(subject)}:\${raw}\`,\n        unitName: \`第\${raw}章 \${unit.unitName || "単元テスト"}\`,`,
              `    if (!groups.has(raw)) {\n      const chapterLabel = /^\\d+$/u.test(raw) ? \`第\${raw}章\` : raw;\n      groups.set(raw, {\n        key: raw,\n        unitId: \`chapter:\${normalizeSubject(subject)}:\${raw}\`,\n        unitName: \`\${chapterLabel} \${unit.unitName || "単元テスト"}\`,`
            );
          }
          elem = elem.replace('国語の進行表は、NEW小学ワーク・漢字ドリルの進行表登録後に使用できます。', '国語の進行表データを読み込めませんでした。再読み込みしてください。');
          fs.writeFileSync('elementary-supabase.js', elem);

          let app = fs.readFileSync('app.js', 'utf8');
          app = app.replace('最近の算数・国語のテストを聞き取り、表面・裏面をまとめて入力します。', '最近の学校単元テストを聞き取り、表面・裏面をまとめて入力します。');
          app = app.replace('大きな単元（章）', '単元（章）');
          app = app.replace('<form id="elementaryTopTestForm" class="elementaryTopTestForm">', '<form id="elementaryTopTestForm" class="elementaryTopTestForm" onsubmit="return false">');
          app = app.replace('<button id="correctElementaryLesson" class="ghostBtn">宿題・進行表を訂正</button>', '<button id="correctElementaryLesson" class="ghostBtn homeworkAdjustBtn">次回宿題を確認・調整</button>');
          app = app.replace('  bindElementaryTopTestEntry(data,studentId,rows);\n', '');
          app = app.replace(/  \$\("content"\)\.querySelectorAll\("\.elementaryOpenProgress"\)\.forEach\([^\n]+\);\n/, '');
          app = app.replace(/  \$\("content"\)\.querySelectorAll\("\.elementarySchoolPosition"\)\.forEach\([^\n]+\);\n/, '');
          app = app.replace(/  \$\("content"\)\.querySelectorAll\("\.elementaryTestEntry"\)\.forEach\([^\n]+\);\n/, '');
          app = app.replace(/  \$\("correctElementaryLesson"\)\?\.addEventListener\([^\n]+\);\n/, '');
          fs.writeFileSync('app.js', app);

          let css = fs.readFileSync('elementary-supabase.css', 'utf8');
          if (!css.includes('.elementaryOtherHomework::placeholder')) css += '\n/* Explicit faint hints requested for elementary free-text homework. */\n.elementaryOtherHomework::placeholder,.elementaryCustomHomeworkText input::placeholder{color:#9aa7a3!important;opacity:1;font-weight:400}\n';
          fs.writeFileSync('elementary-supabase.css', css);

          let index = fs.readFileSync('index.html', 'utf8');
          index = index.replace(/app\.js\?v=[^\"']+/g, 'app.js?v=20260831-elementary-audit-1');
          index = index.replace(/elementary-supabase\.js\?v=[^\"']+/g, 'elementary-supabase.js?v=20260831-elementary-audit-1');
          index = index.replace(/elementary-supabase\.css\?v=[^\"']+/g, 'elementary-supabase.css?v=20260831-elementary-audit-1');
          fs.writeFileSync('index.html', index);
          NODE
      - name: Write comprehensive regression test
        run: |
          cat > tests/elementary-spec-audit.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const app=fs.readFileSync(new URL("../app.js",import.meta.url),"utf8");
          const elem=fs.readFileSync(new URL("../elementary-supabase.js",import.meta.url),"utf8");
          const css=fs.readFileSync(new URL("../elementary-supabase.css",import.meta.url),"utf8");
          const buttons=fs.readFileSync(new URL("../v3-homework-ui-fix.js",import.meta.url),"utf8");
          assert.ok(app.includes('単元（章）'));
          assert.ok(!app.includes('大きな単元（章）'));
          assert.ok(!app.includes('宿題・進行表を訂正'));
          assert.ok(app.includes('次回宿題を確認・調整'));
          assert.ok(app.includes('onsubmit="return false"'));
          assert.ok(!app.includes('bindElementaryTopTestEntry(data,studentId,rows);'));
          assert.ok(!app.includes('querySelectorAll(".elementarySchoolPosition").forEach'));
          assert.ok(!app.includes('querySelectorAll(".elementaryTestEntry").forEach'));
          assert.ok(app.includes('表面の点数<input id="elementaryTopTestScore"'));
          assert.ok(app.includes('value="50" required'));
          assert.ok(app.includes('表面の満点<input id="elementaryTopTestMax"'));
          assert.ok(app.includes('裏面の点数<input id="elementaryTopTestBackScore"'));
          assert.ok(app.includes('value="30" required'));
          assert.ok(app.includes('裏面の満点<input id="elementaryTopTestBackMax"'));
          assert.ok(elem.includes('const otherPlaceholder = normalized === "国語" ? "教科書漢字ドリルなど"'));
          assert.ok(elem.includes('placeholder="${esc(otherPlaceholder)}"'));
          assert.ok(elem.includes("lessonSubjectSelect?.addEventListener('change', syncCustomHomeworkSubject)"));
          assert.ok(elem.includes('memo: text, assignedDate: todayJst()'));
          assert.ok(elem.includes('<legend class="hidden">表面</legend>'));
          assert.ok(elem.includes('表面の点数<input id="eTestScore"'));
          assert.ok(elem.includes('value="50" autofocus'));
          assert.ok(elem.includes('<legend class="hidden">裏面</legend>'));
          assert.ok(elem.includes('裏面の点数<input id="eTestBackScore"'));
          assert.ok(elem.includes('value="30">'));
          assert.ok(elem.includes('scoreEl.value = "50"'));
          assert.ok(elem.includes('backScoreEl.value = "30"'));
          assert.ok(!elem.includes('<legend>表面</legend>'));
          assert.ok(!elem.includes('<legend>裏面</legend>'));
          assert.ok(elem.includes('if (normalized === "国語") return loadJapaneseProgressions(grade);'));
          assert.ok(elem.includes('const selectedTypes = normalized === "国語" ? ["TODAY_REDO"] : ["TRY_REDO", "EXERCISE"]'));
          assert.ok(elem.includes('selectedTypes: [], other: ""'));
          assert.ok(elem.includes('saveSchoolPosition'));
          assert.ok(elem.includes('saveUnitTest'));
          assert.ok(elem.includes('const chapterLabel = /^\\d+$/u.test(raw)'));
          assert.ok(css.includes('.elementaryOtherHomework::placeholder'));
          assert.ok(buttons.includes('次回宿題を確認・調整'));
          assert.ok(buttons.includes('進行表を開く'));
          assert.ok(!buttons.includes('宿題・進行表を訂正'));
          assert.match(app,/replace\(\/\[ァ-ヶ\]\/g/);
          assert.match(app,/student\.reading/);
          assert.match(app,/student\.romaji/);
          assert.ok(app.includes('FAST_RUNTIME_WRITE_ACTIONS.has(action) ? "高速保存中…" : "高速読込中…"'));
          console.log("elementary specification audit: ok");
          EOF
          node <<'NODE'
          const fs=require('fs');
          const p='package.json';
          const pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!pkg.scripts.test.includes('elementary-spec-audit.test.mjs')) pkg.scripts.test += ' && node tests/elementary-spec-audit.test.mjs';
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Validate syntax and all regression tests
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
          node --check tests/elementary-spec-audit.test.mjs
          npm test
      - name: Commit only after full validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js elementary-supabase.js elementary-supabase.css index.html package.json tests/elementary-spec-audit.test.mjs
          git commit -m "Audit and fix elementary classroom specifications" || exit 0
          git push origin HEAD:main
