name: Fix elementary save homework layout
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-elementary-save-homework-layout.py
      - .github/workflows/fix-elementary-save-homework-layout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-elementary-save-homework-layout.py
      - run: node --check elementary-supabase.js
      - run: node --check app.js
      - run: npm test
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js elementary-supabase.css elementary-enhancement.css styles.css index.html
          git commit -m "Fix elementary progress save and homework display"
          git push origin HEAD:main
