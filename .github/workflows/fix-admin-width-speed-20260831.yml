name: Fix admin width and speed 20260831

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-width-speed-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply admin width and speed fix
        run: python3 .github/scripts/fix-admin-width-speed-20260831.py
      - name: Fix audit assertion quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/elementary-spec-audit.test.mjs')
          s = p.read_text()
          s = s.replace("assert.ok(app.includes('Promise.all([api(action), elementaryPromise])');", "assert.ok(app.includes(\"Promise.all([api(action), elementaryPromise])\"));")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check tests/elementary-spec-audit.test.mjs
          grep -F 'Promise.all([api(action), elementaryPromise])' app.js
          grep -F 'class="adminStudentsTable"' app.js
          grep -F 'Admin workspace: use more horizontal space and minimize table scrolling.' styles.css
          npm test
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html tests/elementary-spec-audit.test.mjs
          git commit -m "Widen and speed up admin dashboard" || exit 0
          git push origin HEAD:main
