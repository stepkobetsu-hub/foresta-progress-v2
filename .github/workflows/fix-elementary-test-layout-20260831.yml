name: Fix elementary test layout 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-elementary-test-layout-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move test date up and note left
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('elementary-teacher-layout-fix.css')
          index_path = Path('index.html')
          css = css_path.read_text()
          index = index_path.read_text()

          marker = '/* Elementary unit-test top form row placement. */'
          rule = '''\n/* Elementary unit-test top form row placement. */\n@media(min-width:901px){\n  .elementaryTopTestForm .elementaryTopTestDate{grid-column:7!important;grid-row:1!important;align-self:end!important}\n  .elementaryTopTestForm .elementaryBackScoreNote{grid-column:3/7!important;grid-row:2!important;justify-self:start!important;align-self:start!important;margin-top:-1px!important;font-size:.59rem!important;line-height:1.25!important;color:#74827e!important;white-space:nowrap!important}\n}\n'''
          if marker in css:
              css = re.sub(r'\n/\* Elementary unit-test top form row placement\. \*/[\s\S]*?\n}\n', rule, css, count=1)
          else:
              css += rule

          index = re.sub(r'elementary-teacher-layout-fix\.css\?v=[^\"\']+', 'elementary-teacher-layout-fix.css?v=20260831-test-layout-2', index)

          css_path.write_text(css)
          index_path.write_text(index)
          PY
      - name: Validate
        run: |
          grep -F '.elementaryTopTestForm .elementaryTopTestDate{grid-column:7!important;grid-row:1!important' elementary-teacher-layout-fix.css
          grep -F '.elementaryTopTestForm .elementaryBackScoreNote{grid-column:3/7!important;grid-row:2!important' elementary-teacher-layout-fix.css
          grep -F 'elementary-teacher-layout-fix.css?v=20260831-test-layout-2' index.html
          npm test
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-teacher-layout-fix.css index.html
          git commit -m "Align elementary test date and note" || exit 0
          git push origin HEAD:main
