name: Complete elementary Japanese summary units 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-elementary-japanese-summary-20260831.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add source-sheet summary units
        run: |
          node <<'NODE'
          const fs = require('fs');
          const additions = {
            1: [
              ['ELEM-JPN-1-056',56,'まとめ','まとめ-1','１年の まとめ かん字（1）','140'],
              ['ELEM-JPN-1-057',57,'まとめ','まとめ-2','かん字（2）','141'],
              ['ELEM-JPN-1-058',58,'まとめ','まとめ-3','ことば（1）','142'],
              ['ELEM-JPN-1-059',59,'まとめ','まとめ-4','ことば（2）','143'],
              ['ELEM-JPN-1-060',60,'まとめ','まとめ-5','ことばの せかいを ひろげよう','144'],
            ],
            2: [
              ['ELEM-JPN-2-039',39,'まとめ','まとめ-1','かん字','140'],
              ['ELEM-JPN-2-040',40,'まとめ','まとめ-2','ことば','142'],
              ['ELEM-JPN-2-041',41,'まとめ','まとめ-3','ことばのせかいを広げよう','144'],
            ],
            3: [
              ['ELEM-JPN-3-032',32,'まとめ','まとめ-1','漢字（1）','140'],
              ['ELEM-JPN-3-033',33,'まとめ','まとめ-2','漢字（2）','141'],
              ['ELEM-JPN-3-034',34,'まとめ','まとめ-3','漢字（3）','142'],
              ['ELEM-JPN-3-035',35,'まとめ','まとめ-4','言葉（1）','143'],
              ['ELEM-JPN-3-036',36,'まとめ','まとめ-5','言葉（2）','144'],
            ],
            4: [
              ['ELEM-JPN-4-040',40,'まとめ','まとめ-1','漢字（１）','132'],
              ['ELEM-JPN-4-041',41,'まとめ','まとめ-2','漢字（２）','133'],
              ['ELEM-JPN-4-042',42,'まとめ','まとめ-3','漢字（３）','134'],
              ['ELEM-JPN-4-043',43,'まとめ','まとめ-4','言葉（１）','135'],
              ['ELEM-JPN-4-044',44,'まとめ','まとめ-5','言葉（２）','136'],
            ],
            5: [
              ['ELEM-JPN-5-040',40,'まとめ','まとめ-1','漢字（１）','140'],
              ['ELEM-JPN-5-041',41,'まとめ','まとめ-2','漢字（２）','141'],
              ['ELEM-JPN-5-042',42,'まとめ','まとめ-3','漢字（３）','142'],
              ['ELEM-JPN-5-043',43,'まとめ','まとめ-4','言葉（１）','143'],
              ['ELEM-JPN-5-044',44,'まとめ','まとめ-5','言葉（２）','144'],
            ],
            6: [
              ['ELEM-JPN-6-041',41,'まとめ','まとめ-1','漢字（１）','132'],
              ['ELEM-JPN-6-042',42,'まとめ','まとめ-2','漢字（２）','133'],
              ['ELEM-JPN-6-043',43,'まとめ','まとめ-3','漢字（３）','134'],
              ['ELEM-JPN-6-044',44,'まとめ','まとめ-4','言葉（１）','135'],
              ['ELEM-JPN-6-045',45,'まとめ','まとめ-5','言葉（２）','136'],
            ],
          };
          for (const [grade, rows] of Object.entries(additions)) {
            const path = `data/elementary-japanese-mitsumura-${grade}.json`;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const ids = new Set(data.units.map((u) => u.unitId));
            for (const [unitId, displayOrder, chapter, unitNumber, unitName, page] of rows) {
              if (!ids.has(unitId)) data.units.push({unitId, displayOrder, chapter, unitNumber, unitName, page});
            }
            data.units.sort((a,b) => Number(a.displayOrder)-Number(b.displayOrder));
            fs.writeFileSync(path, JSON.stringify(data) + '\n');
          }
          const testPath = 'tests/elementary-japanese-progress.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('const g5 = JSON.parse', 'const expectedCounts = {1:60,2:41,3:36,4:44,5:44,6:45};\nfor (const [grade, expected] of Object.entries(expectedCounts)) {\n  const data = JSON.parse(fs.readFileSync(new URL(`../data/elementary-japanese-mitsumura-${grade}.json`, import.meta.url), "utf8"));\n  assert.equal(data.units.length, expected, `小${grade}の元Excel対象単元数が一致しません`);\n}\nconst g5 = JSON.parse');
          test = test.replace('assert.equal(g5.units.length, 39);', 'assert.equal(g5.units.length, 44);\nassert.ok(g5.units.some((u) => u.unitName === "言葉（２）" && u.chapter === "まとめ"));');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Validate and test
        run: |
          node --check elementary-supabase.js
          node --check tests/elementary-japanese-progress.test.mjs
          npm test
      - name: Commit validated completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elementary-japanese-mitsumura-*.json tests/elementary-japanese-progress.test.mjs
          git commit -m "Complete NEW小学ワーク光村 Japanese progressions" || exit 0
          git push origin HEAD:main
