name: Fix elementary active session and guide
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-elementary-active-session-and-guide.py
      - .github/workflows/fix-elementary-active-session-and-guide.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-elementary-active-session-and-guide.py
      - run: node --check app.js
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js elementary-supabase.js index.html
          git commit -m "Use live teacher session for elementary controls and add third prompt"
          git push origin HEAD:main
