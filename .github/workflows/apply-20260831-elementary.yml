name: Apply elementary school support 20260831

on:
  push:
    branches: [main]
    paths:
      - elementary-run-trigger-main.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/elementary-school-20260831
          fetch-depth: 0

      - name: Repair generated patch quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/apply-20260831-elementary.mjs')
          s=p.read_text()
          def repair(name, after):
              global s
              start=f'const {name}=String.raw`'
              a=s.index(start)
              b=a+len(start)
              marker='`;\n'+after
              c=s.index(marker,b)
              body=s[b:c].replace('\\${','${')
              s=s[:a]+f'const {name}='+json.dumps(body,ensure_ascii=False)+';\n'+after+s[c+len(marker):]
          repair('studentUi',"app=once(app,'function homeworkDisplayInfo(item) {'")
          repair('teacherUi',"app=once(app,'async function renderToday() {'")
          old="function once(src,find,repl,label){const n=src.split(find).length-1;if(n!==1)throw new Error(`${label}: ${n} matches`);return src.replace(find,repl)}"
          new="function once(src,find,repl,label){const n=src.split(find).length-1;if(n!==1){if(label==='homework guide'&&n===0)return src;throw new Error(`${label}: ${n} matches`);}return src.replace(find,repl)}"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check scripts/apply-20260831-elementary.mjs

      - name: Apply elementary patch and record failure
        shell: bash
        run: |
          set +e
          node scripts/apply-20260831-elementary.mjs > ELEMENTARY_PATCH_RESULT.txt 2>&1
          code=$?
          cat ELEMENTARY_PATCH_RESULT.txt
          echo "exit_code=$code" >> ELEMENTARY_PATCH_RESULT.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ELEMENTARY_PATCH_RESULT.txt
            git commit -m "Record elementary patch failure" || true
            git push origin HEAD:feature/elementary-school-20260831
            exit "$code"
          fi

      - name: Validate JavaScript and Apps Script syntax
        shell: bash
        run: |
          set +e
          : > ELEMENTARY_VALIDATE_RESULT.txt
          node --check app.js >> ELEMENTARY_VALIDATE_RESULT.txt 2>&1
          app_code=$?
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js >> ELEMENTARY_VALIDATE_RESULT.txt 2>&1
          gas_code=$?
          echo "app_code=$app_code gas_code=$gas_code" >> ELEMENTARY_VALIDATE_RESULT.txt
          cat ELEMENTARY_VALIDATE_RESULT.txt
          if [ "$app_code" -ne 0 ] || [ "$gas_code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ELEMENTARY_VALIDATE_RESULT.txt
            git commit -m "Record elementary syntax failure" || true
            git push origin HEAD:feature/elementary-school-20260831
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html apps-script/Code.gs ELEMENTARY_PATCH_RESULT.txt ELEMENTARY_VALIDATE_RESULT.txt
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Add elementary school progress and unit tests"
          git push origin HEAD:feature/elementary-school-20260831
