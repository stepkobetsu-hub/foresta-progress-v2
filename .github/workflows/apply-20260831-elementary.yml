name: Apply elementary school support 20260831

on:
  push:
    branches: [main]
    paths:
      - elementary-run-trigger-main.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/elementary-school-20260831
          fetch-depth: 0

      - name: Apply elementary patch and record failure
        shell: bash
        run: |
          set +e
          node scripts/apply-20260831-elementary.mjs > ELEMENTARY_PATCH_RESULT.txt 2>&1
          code=$?
          cat ELEMENTARY_PATCH_RESULT.txt
          echo "exit_code=$code" >> ELEMENTARY_PATCH_RESULT.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ELEMENTARY_PATCH_RESULT.txt
            git commit -m "Record elementary patch failure" || true
            git push origin HEAD:feature/elementary-school-20260831
            exit "$code"
          fi

      - name: Validate JavaScript and Apps Script syntax
        shell: bash
        run: |
          node --check app.js
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js

      - name: Run tests
        run: npm test

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html apps-script/Code.gs ELEMENTARY_PATCH_RESULT.txt
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Add elementary school progress and unit tests"
          git push origin HEAD:feature/elementary-school-20260831
