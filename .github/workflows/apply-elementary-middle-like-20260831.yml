name: Apply elementary middle-like progression

on:
  push:
    branches:
      - feature/elementary-middle-like-20260831
    paths:
      - .github/workflows/apply-elementary-middle-like-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/elementary-middle-like-20260831
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-elementary-middle-like-20260831.py

      - name: Validate JavaScript and tests
        run: |
          node --check app.js
          node --check elementary-enhancement.js
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js
          npm test

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js elementary-enhancement.js styles.css
          git commit -m "Make elementary progression work like middle school" || true
          git push origin HEAD:feature/elementary-middle-like-20260831
