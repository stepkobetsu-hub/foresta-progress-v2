name: Apply elementary middle-like progression

on:
  push:
    branches: [feature/elementary-middle-like-20260831]
    paths:
      - .github/workflows/apply-elementary-middle-like-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/elementary-middle-like-20260831
          fetch-depth: 0

      - name: Patch elementary progression experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          enh_path = Path('elementary-enhancement.js')
          css_path = Path('styles.css')
          app = app_path.read_text()
          enh = enh_path.read_text()
          css = css_path.read_text()

          def sub_once(src, pattern, repl, label, flags=re.S):
              out, n = re.subn(pattern, repl, src, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: {n} matches')
              return out

          # 1) Elementary top screen: enrolled subjects only, recent math/Japanese history side by side.
          block = r'''function elementaryDiffClass(v){return v>0?"ahead":v<0?"behind":v===0?"same":"unset"}
function elementaryCoreRows(data){const existing=data?.progress||[], raw=[...(data?.elementary?.subjects||[]),...(data?.student?.subjects||[])].map(s=>String(s||"").trim()==="数学"?"算数":String(s||"").trim()).filter(s=>["算数","国語","英語"].includes(s)), subjects=[...new Set(raw)];const ordered=(subjects.length?subjects:["算数"]).sort((a,b)=>["算数","国語","英語"].indexOf(a)-["算数","国語","英語"].indexOf(b));return ordered.map(subject=>existing.find(r=>(r.subject==="数学"?"算数":r.subject)===subject)||{subject,differenceLabel:"未設定",schoolUnitName:"",forestaUnitName:"",unitOptions:[],latestUnitTest:null})}
function elementaryTestsHtml(tests){const rows=(tests||[]).slice(0,10);if(!rows.length)return '<div class="emptyState">学校の単元テストはまだ登録されていません。</div>';return '<div class="tableWrap"><table><thead><tr><th>日付</th><th>科目</th><th>単元</th><th>点数</th></tr></thead><tbody>'+rows.map(t=>`<tr><td>${esc(fmtShortDate(t.testDate))}</td><td>${esc(t.subject)}</td><td>${esc(t.unitName||"")}</td><td><strong class="elementaryScore">${esc(t.score)}/${esc(t.maxScore||100)}</strong></td></tr>`).join('')+'</tbody></table></div>'}
function elementarySubjectTestHistory(tests,subject){const rows=(tests||[]).filter(t=>(t.subject==="数学"?"算数":t.subject)===subject).slice(0,6);if(!rows.length)return '<div class="emptyState compact">まだありません。</div>';return `<div class="elementarySubjectTestList">${rows.map(t=>`<div class="elementarySubjectTestRow"><span>${esc(fmtShortDate(t.testDate))}</span><strong>${esc(t.unitName||"単元テスト")}</strong><b>${esc(t.score)}/${esc(t.maxScore||100)}</b></div>`).join('')}</div>`}
function elementaryRecentTestsHtml(tests){const all=(tests||[]);const other=all.filter(t=>!["算数","数学","国語"].includes(t.subject)).slice(0,4);return `<div class="elementaryRecentTestGrid"><section><h3>算数</h3>${elementarySubjectTestHistory(all,"算数")}</section><section><h3>国語</h3>${elementarySubjectTestHistory(all,"国語")}</section></div>${other.length?`<details class="elementaryOtherTests"><summary>英語などの履歴</summary>${elementaryTestsHtml(other)}</details>`:""}`}
function renderElementaryStudent(data){const rows=elementaryCoreRows(data);$("content").innerHTML=`<header class="pageHead"><div><span class="elementaryKicker">小学生</span><h1>${esc(data.student.name)}さんの進捗</h1><p>${esc(data.student.school||"学校未登録")} / ${esc(data.student.grade)}　学校との差を単元数で確認します。</p></div></header><section class="elementaryProgressGrid">${rows.map(r=>`<article class="card elementarySubjectCard ${subjectProgressClass(r.subject)}"><div class="elementaryCardHead"><span class="subjectPill">${esc(r.subject)}</span><strong class="elementaryDifference ${elementaryDiffClass(r.differenceUnits)}">${esc(r.differenceLabel||"未設定")}</strong></div><p><small>学校</small><br><strong>${esc(r.schoolUnitName||"未入力")}</strong></p><p><small>塾</small><br><strong>${esc(r.forestaUnitName||"未入力")}</strong></p><p>直近テスト：${r.latestUnitTest?`<strong class="elementaryScore">${esc(r.latestUnitTest.score)}点</strong>`:"未登録"}</p><button class="secondaryBtn elementaryStudentProgress" data-subject="${esc(r.subject)}">進行表を見る</button></article>`).join('')}</section><section class="cardGrid"><article class="card span12"><p class="cardTitle">最近の学校単元テスト</p>${elementaryRecentTestsHtml(data.elementary?.unitTests||[])}</article><article class="card span12"><div class="homeworkPanelHead"><p class="cardTitle">次回までの宿題</p><button id="openHomeworkArchiveHome" class="ghostBtn">アーカイブ</button></div><div class="homeworkList">${homeworkHtml(data.homework||[],"student")}</div></article></section>`;$("content").querySelectorAll(".elementaryStudentProgress").forEach(b=>b.onclick=()=>openProgress({subject:b.dataset.subject,mode:"view"}));bindHomeworkChecks();bindHomeworkArchiveActions("student");$("openHomeworkArchiveHome")?.addEventListener("click",()=>openView("homeworkArchive"))}
'''
          app = sub_once(app, r'function elementaryDiffClass\(v\).*?\n\nfunction homeworkDisplayInfo', block + '\nfunction homeworkDisplayInfo', 'student elementary block')

          # 2) Teacher top: immediate test entry and recent math/Japanese history.
          teacher_block = r'''function elemOptions(r){return '<option value="">学校進度を選ぶ</option>'+(r.unitOptions||[]).map(u=>`<option value="${esc(u.unitId)}" ${u.unitId===r.schoolUnitId?"selected":""}>${esc([u.unitNumber,u.unitName].filter(Boolean).join(" "))}</option>`).join('')}
function elementaryTopTestEntryHtml(rows){return `<article id="elementaryTopTestEntry" class="card elementaryTopTestEntry"><div><p class="cardTitle">学校の単元テスト入力</p><p class="muted">最近の算数・国語のテストを聞き取り、その場で入力します。</p></div><form id="elementaryTopTestForm" class="elementaryTopTestForm"><label>科目<select id="elementaryTopTestSubject" class="field">${rows.map(r=>`<option>${esc(r.subject)}</option>`).join('')}</select></label><label id="elementaryTopTestUnitWrap">単元<select id="elementaryTopTestUnit" class="field"></select></label><label id="elementaryTopTestFreeWrap" class="hidden">単元名<input id="elementaryTopTestFree" class="field" maxlength="80"></label><label>点数<input id="elementaryTopTestScore" class="field" type="number" min="0" max="999" required></label><label>満点<input id="elementaryTopTestMax" class="field" type="number" min="1" max="999" value="100"></label><label>テスト日<input id="elementaryTopTestDate" class="field" type="date" value="${dateInputValue(new Date())}"></label><button class="primaryBtn" type="submit">保存</button></form><output id="elementaryTopTestStatus" class="lessonSaveStatus" aria-live="polite"></output></article>`}
function bindElementaryTopTestEntry(data,studentId,rows){const form=$("elementaryTopTestForm");if(!form)return;const subject=$("elementaryTopTestSubject"),unit=$("elementaryTopTestUnit"),unitWrap=$("elementaryTopTestUnitWrap"),freeWrap=$("elementaryTopTestFreeWrap");const refresh=()=>{const row=rows.find(r=>r.subject===subject.value)||{},units=row.unitOptions||[];unit.innerHTML='<option value="">単元を選ぶ</option>'+units.map(u=>`<option value="${esc(u.unitId)}" ${u.unitId===row.schoolUnitId?"selected":""}>${esc([u.unitNumber,u.unitName].filter(Boolean).join(" "))}</option>`).join('');unitWrap.classList.toggle("hidden",!units.length);freeWrap.classList.toggle("hidden",!!units.length)};subject.onchange=refresh;refresh();form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button[type="submit"]'),hasUnits=!unitWrap.classList.contains("hidden");btn.disabled=true;$("elementaryTopTestStatus").textContent="保存しています…";try{await api("saveElementaryUnitTest",{studentId,subject:subject.value,unitId:hasUnits?unit.value:"",unitName:hasUnits?"":$("elementaryTopTestFree").value.trim(),testDate:$("elementaryTopTestDate").value,score:$("elementaryTopTestScore").value,maxScore:$("elementaryTopTestMax").value||100,memo:""},{silent:true});delete state.teacherStudentCache[String(studentId)];state.dashboard=null;status("学校の単元テストを保存しました。");await renderTeacherStudent(studentId,{force:true})}catch(err){btn.disabled=false;$("elementaryTopTestStatus").textContent=err.message}}}
function renderElementaryTeacherStudent(data,studentId){const rows=elementaryCoreRows(data), summary=homeworkCompletionSummary(data.homework||[]), teachers=(data.teacherCandidates||[]).map(t=>`<option value="${esc(t.loginId)}" ${String(t.loginId)===String(state.session.loginId)?"selected":""}>${esc(t.name)}</option>`).join('');$("content").innerHTML=`${selectedTabsHtml()}<header class="pageHead"><div><span class="elementaryKicker">小学生</span><h1>${esc(data.student.name)}</h1><p>${esc(data.student.studentId)} / ${esc(data.student.campus)} / ${esc(data.student.grade)} / ${esc(data.student.school||"学校未登録")}</p></div></header><article class="card elementaryTeacherGuide"><strong>授業前に確認</strong><span>①学校はどこまで進んだか　②最近の学校単元テストは何点だったか</span></article>${elementaryTopTestEntryHtml(rows)}<div class="elementaryTeacherToolbar"><label>担当講師<select id="elementaryLessonTeacher" class="field">${teachers}</select></label><button id="correctElementaryLesson" class="ghostBtn">宿題・進行表を訂正</button></div><section class="elementaryProgressGrid">${rows.map(r=>`<article class="card elementarySubjectCard ${subjectProgressClass(r.subject)}"><div class="elementaryCardHead"><span class="subjectPill">${esc(r.subject)}</span><strong class="elementaryDifference ${elementaryDiffClass(r.differenceUnits)}">${esc(r.differenceLabel||"未設定")}</strong></div><label class="elementarySchoolSelect">学校の現在地<select class="field elementarySchoolPosition" data-subject="${esc(r.subject)}">${elemOptions(r)}</select><small>選ぶと自動保存</small></label><p><small>塾の現在地</small><br><strong>${esc(r.forestaUnitName||"未入力")}</strong></p><p>直近の学校単元テスト：${r.latestUnitTest?`<strong class="elementaryScore">${esc(r.latestUnitTest.score)}点</strong>`:"未登録"}</p><div class="actionRow"><button class="secondaryBtn elementaryOpenProgress" data-subject="${esc(r.subject)}">進行表を開く</button><button class="ghostBtn elementaryTestEntry" data-subject="${esc(r.subject)}">単元テスト入力</button></div></article>`).join('')}</section><section class="cardGrid"><article class="card span7"><p class="cardTitle">最近の学校単元テスト</p>${elementaryRecentTestsHtml(data.elementary?.unitTests||[])}</article><article class="card span5"><div class="homeworkPanelHead"><p class="cardTitle">前回宿題</p><button id="openTeacherHomeworkArchive" class="ghostBtn">アーカイブ</button></div><p class="muted">完了 ${summary.completed}/${summary.total}</p><div class="homeworkList">${homeworkHtml(data.homework||[],"teacher")}</div></article></section>`;bindSelectedTabs();bindElementaryTopTestEntry(data,studentId,rows);$("content").querySelectorAll(".elementaryOpenProgress").forEach(b=>b.onclick=()=>openProgress({subject:b.dataset.subject,mode:"lesson",studentId,teacherId:$("elementaryLessonTeacher")?.value||state.session.loginId}));$("content").querySelectorAll(".elementarySchoolPosition").forEach(s=>s.onchange=async()=>{if(!s.value)return;s.disabled=true;try{await api("saveSchoolPosition",{studentId,subject:s.dataset.subject,unitId:s.value,recordedDate:dateInputValue(new Date())},{silent:true});delete state.teacherStudentCache[String(studentId)];state.dashboard=null;status("学校進度を保存しました。");await renderTeacherStudent(studentId,{force:true})}catch(e){status(e.message,true);s.disabled=false}});$("content").querySelectorAll(".elementaryTestEntry").forEach(b=>b.onclick=()=>openElementaryUnitTestForm(data,studentId,b.dataset.subject));$("correctElementaryLesson")?.addEventListener("click",()=>openLessonCorrection(studentId));bindTeacherHomeworkChecks();bindHomeworkArchiveActions("teacher");$("openTeacherHomeworkArchive")?.addEventListener("click",()=>{state.activeView="selectedArchive";openView("selectedArchive")})}
function openElementaryUnitTestForm(data,studentId,preset,presetUnitId=""){const rows=elementaryCoreRows(data), subjects=rows.map(r=>r.subject);showModal(`<h2>学校の単元テスト入力</h2><form id="elementaryTestForm" class="elementaryTestForm"><label>科目<select id="elementaryTestSubject" class="field">${subjects.map(s=>`<option ${s===preset?"selected":""}>${esc(s)}</option>`).join('')}</select></label><label id="elementaryTestUnitWrap">単元<select id="elementaryTestUnit" class="field"></select></label><label id="elementaryTestUnitFreeWrap" class="hidden">単元名<input id="elementaryTestUnitFree" class="field" maxlength="80"></label><label>テスト日<input id="elementaryTestDate" class="field" type="date" value="${dateInputValue(new Date())}"></label><div class="elementaryScoreInputs"><label>点数<input id="elementaryTestScore" class="field" type="number" min="0" max="999" required></label><label>満点<input id="elementaryTestMax" class="field" type="number" min="1" max="999" value="100"></label></div><label>メモ<input id="elementaryTestMemo" class="field" maxlength="120"></label><output id="elementaryTestStatus"></output><button class="primaryBtn" type="submit">点数を保存</button></form>`);const refresh=()=>{const r=rows.find(x=>x.subject===$("elementaryTestSubject").value)||{}, units=r.unitOptions||[];$("elementaryTestUnit").innerHTML='<option value="">単元を選ぶ</option>'+units.map(u=>`<option value="${esc(u.unitId)}" ${(presetUnitId&&r.subject===preset&&u.unitId===presetUnitId)||(!presetUnitId&&u.unitId===r.schoolUnitId)?"selected":""}>${esc([u.unitNumber,u.unitName].filter(Boolean).join(" "))}</option>`).join('');$("elementaryTestUnitWrap").classList.toggle("hidden",!units.length);$("elementaryTestUnitFreeWrap").classList.toggle("hidden",!!units.length)};$("elementaryTestSubject").onchange=()=>{presetUnitId="";refresh()};refresh();$("elementaryTestForm").onsubmit=async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button[type="submit"]');btn.disabled=true;try{const units=!$("elementaryTestUnitWrap").classList.contains("hidden");await api("saveElementaryUnitTest",{studentId,subject:$("elementaryTestSubject").value,unitId:units?$("elementaryTestUnit").value:"",unitName:units?"":$("elementaryTestUnitFree").value.trim(),testDate:$("elementaryTestDate").value,score:$("elementaryTestScore").value,maxScore:$("elementaryTestMax").value||100,memo:$("elementaryTestMemo").value.trim()},{silent:true});delete state.teacherStudentCache[String(studentId)];state.dashboard=null;$("modal").dataset.refreshTeacher="true";closeModal();status("学校の単元テストを保存しました。")}catch(err){btn.disabled=false;$("elementaryTestStatus").textContent=err.message}}}
'''
          app = sub_once(app, r'function elemOptions\(r\).*?\n\nasync function renderToday', teacher_block + '\nasync function renderToday', 'teacher elementary block')

          # 3) Progression rows: add per-unit school test input next to existing school/today controls.
          target = 'const schoolButton = options.mode === "lesson" ? `<button type="button" class="schoolPinButton ${u.schoolPosition ? "active" : ""}" data-unit="${esc(u.unitId)}" aria-label="${esc(u.unitName)}を学校の現在地にする">${u.schoolPosition ? `🏫 学校 ${esc(fmtShortDate(u.schoolPositionAt))}` : "🏫"}</button>` : "";'
          if target not in app:
              raise SystemExit('schoolButton target missing')
          app = app.replace(target, target + '\n      const elementaryTestButton = options.mode === "lesson" && isElementaryGradeValue(state.dashboard?.student?.grade) ? `<button type="button" class="elementaryUnitTestButton" data-unit="${esc(u.unitId)}" title="この単元の学校テストを入力">📝 テスト</button>` : "";', 1)
          old_meta = '${dateHistory}${todayButton}${schoolButton}${!isElementaryGradeValue(state.dashboard?.student?.grade)'
          if old_meta not in app:
              raise SystemExit('unit meta insertion target missing')
          app = app.replace(old_meta, '${dateHistory}${todayButton}${schoolButton}${elementaryTestButton}${!isElementaryGradeValue(state.dashboard?.student?.grade)', 1)

          school_bind_anchor = '$("modalBody").querySelectorAll(".schoolPinButton").forEach((button) => button.onclick = async (event) => {'
          idx = app.find(school_bind_anchor)
          if idx < 0:
              raise SystemExit('school bind anchor missing')
          # Insert test-button binding just before school-position binding.
          bind_code = '''$("modalBody").querySelectorAll(".elementaryUnitTestButton").forEach((button) => button.onclick = (event) => {
      event.preventDefault();
      openElementaryUnitTestForm(state.dashboard || {}, options.studentId, options.subject, button.dataset.unit);
    });
    '''
          app = app[:idx] + bind_code + app[idx:]

          # 4) Enhancement fallback should yield to the native interactive progression when the deployed API supports it.
          if 'const nativeProgressReady = new Map();' not in enh:
              enh = enh.replace('let lastSignature = "";\n', 'let lastSignature = "";\nconst nativeProgressReady = new Map();\n', 1)
          if 'async function probeNativeProgress' not in enh:
              probe = '''\nasync function probeNativeProgress(subject, dashboard) {
  const normalized = normalizeSubject(subject);
  try {
    const data = await callApi("getProgression", { studentId: pageStudentId(), subject: normalized });
    const ready = !!(data?.summary?.elementary && Array.isArray(data?.units) && data.units.length);
    nativeProgressReady.set(normalized, ready);
    return ready;
  } catch (_) {
    nativeProgressReady.set(normalized, false);
    return false;
  }
}\n'''
              enh = enh.replace('async function loadProgressions() {', probe + '\nasync function loadProgressions() {', 1)
          enhance_anchor = 'const enrolled = enrolledSubjects(dashboard);\n'
          if enhance_anchor in enh and 'probeNativeProgress' in enh and 'Promise.all(enrolled.map' not in enh:
              enh = enh.replace(enhance_anchor, enhance_anchor + '    await Promise.all(enrolled.map((subject) => probeNativeProgress(subject, dashboard)));\n', 1)
          click_anchor = 'if (!["算数", "英語"].includes(subject)) return;\n  event.preventDefault();'
          if click_anchor not in enh:
              raise SystemExit('enhancement click anchor missing')
          enh = enh.replace(click_anchor, 'if (!["算数", "英語"].includes(subject)) return;\n  if (nativeProgressReady.get(subject) === true) return;\n  event.preventDefault();', 1)

          # 5) Styling for recent histories, quick input, and unit test button.
          marker = '/* elementary-middle-like-20260831 */'
          if marker not in css:
              css += '''\n\n/* elementary-middle-like-20260831 */
.elementaryRecentTestGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}.elementaryRecentTestGrid>section{border:1px solid #dbe4e7;border-radius:14px;padding:12px;background:#fbfdfd}.elementaryRecentTestGrid h3{margin:0 0 8px;font-size:.98rem}.elementarySubjectTestList{display:grid;gap:6px}.elementarySubjectTestRow{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #edf1f2}.elementarySubjectTestRow:last-child{border-bottom:0}.elementarySubjectTestRow span{font-size:.78rem;color:#64748b}.elementarySubjectTestRow strong{font-size:.88rem}.elementarySubjectTestRow b{font-size:1rem}.elementaryOtherTests{margin-top:10px}.elementaryTopTestEntry{margin:12px 0 16px}.elementaryTopTestForm{display:grid;grid-template-columns:110px minmax(180px,1.5fr) 90px 90px 150px auto;gap:10px;align-items:end}.elementaryTopTestForm label{display:grid;gap:4px;font-size:.78rem;font-weight:700}.elementaryUnitTestButton{border:1px solid #f1c27d;background:#fffaf0;color:#8a4b08;border-radius:9px;padding:6px 9px;font-weight:800;cursor:pointer}.elementaryUnitTestButton:hover{background:#fff3d6}.emptyState.compact{padding:12px}.elementaryProgressGrid{align-items:stretch}@media(max-width:900px){.elementaryRecentTestGrid{grid-template-columns:1fr}.elementaryTopTestForm{grid-template-columns:1fr 1fr}.elementaryTopTestForm button{grid-column:1/-1}}\n'''

          app_path.write_text(app)
          enh_path.write_text(enh)
          css_path.write_text(css)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check elementary-enhancement.js
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js
          npm test

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js elementary-enhancement.js styles.css
          git commit -m "Make elementary progression work like middle school" || true
          git push origin HEAD:feature/elementary-middle-like-20260831
