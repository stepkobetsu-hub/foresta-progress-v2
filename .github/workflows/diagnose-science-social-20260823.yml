name: Apply five-subject student dashboard via existing runner

on:
  push:
    branches: [main]
    paths:
      - science-social-diagnose-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dashboard patch
        run: node scripts/apply-20260823-five-subject-student-dashboard.mjs
      - name: Run tests
        run: npm test
      - name: Parse-check browser code
        run: node --check app.js && node --check domain.js
      - name: Verify dashboard markers
        shell: bash
        run: |
          grep -q 'studentComparisonMiniHtml(data)' app.js
          grep -q 'studentFiveSubjectGraph' app.js
          grep -q 'five-subject student dashboard' styles.css
          grep -q 'app.js?v=20260823-five-subject-dashboard' index.html
      - name: Commit verified dashboard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js styles.css index.html; then
            echo 'No source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html
          git commit -m 'Improve five-subject student dashboard'
          git push origin HEAD:main
