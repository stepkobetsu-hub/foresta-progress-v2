name: Apply readable homework labels 2026-08-23

on:
  push:
    branches: [main]
    paths:
      - homework-readable-trigger.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-homework-readable
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/apply-20260823-homework-readable.mjs
      - name: Run tests
        run: npm test
      - name: Parse-check browser JavaScript
        run: node --check app.js && node --check domain.js
      - name: Verify readable homework UI
        shell: bash
        run: |
          grep -q 'function homeworkDisplayInfo' app.js
          grep -q 'TRYの赤×なおし' app.js
          grep -q '暗記マーク（基本文の暗記）' app.js
          grep -q 'app.js?v=20260823-homework-readable' index.html
          grep -q 'readable homework labels' styles.css
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js styles.css index.html; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html
          git commit -m "Make student homework labels readable"
          git push origin HEAD:main
