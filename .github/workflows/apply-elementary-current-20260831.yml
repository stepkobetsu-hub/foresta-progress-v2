name: Apply elementary support to current main

on:
  push:
    branches: [feature/elementary-school-current-20260831]
    paths:
      - .github/workflows/apply-elementary-current-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feature/elementary-school-current-20260831
          fetch-depth: 0

      - name: Load tested elementary patch script
        shell: bash
        run: |
          git fetch origin feature/elementary-school-20260831
          mkdir -p scripts
          git show origin/feature/elementary-school-20260831:scripts/apply-20260831-elementary.mjs > scripts/apply-20260831-elementary.mjs

      - name: Repair generated patch quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/apply-20260831-elementary.mjs')
          s=p.read_text()
          def repair(name, after):
              global s
              start=f'const {name}=String.raw`'
              if start not in s:
                  return
              a=s.index(start)
              b=a+len(start)
              marker='`;\n'+after
              c=s.index(marker,b)
              body=s[b:c].replace('\\${','${').replace('\\`','`')
              s=s[:a]+f'const {name}='+json.dumps(body,ensure_ascii=False)+';\n'+after+s[c+len(marker):]
          repair('studentUi',"app=once(app,'function homeworkDisplayInfo(item) {'")
          repair('teacherUi',"app=once(app,'async function renderToday() {'")
          old="function once(src,find,repl,label){const n=src.split(find).length-1;if(n!==1)throw new Error(`${label}: ${n} matches`);return src.replace(find,repl)}"
          new="function once(src,find,repl,label){const n=src.split(find).length-1;if(n!==1){if(label==='homework guide'&&n===0)return src;throw new Error(`${label}: ${n} matches`);}return src.replace(find,repl)}"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check scripts/apply-20260831-elementary.mjs

      - name: Apply patch
        shell: bash
        run: |
          set +e
          node scripts/apply-20260831-elementary.mjs > ELEMENTARY_CURRENT_RESULT.txt 2>&1
          code=$?
          echo "exit_code=$code" >> ELEMENTARY_CURRENT_RESULT.txt
          cat ELEMENTARY_CURRENT_RESULT.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ELEMENTARY_CURRENT_RESULT.txt scripts/apply-20260831-elementary.mjs
            git commit -m "Record current-main elementary patch failure" || true
            git push origin HEAD:feature/elementary-school-current-20260831
            exit "$code"
          fi

      - name: Validate
        shell: bash
        run: |
          set +e
          : > ELEMENTARY_CURRENT_VALIDATE.txt
          node --check app.js >> ELEMENTARY_CURRENT_VALIDATE.txt 2>&1
          app_code=$?
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js >> ELEMENTARY_CURRENT_VALIDATE.txt 2>&1
          gas_code=$?
          npm test >> ELEMENTARY_CURRENT_VALIDATE.txt 2>&1
          test_code=$?
          echo "app_code=$app_code gas_code=$gas_code test_code=$test_code" >> ELEMENTARY_CURRENT_VALIDATE.txt
          cat ELEMENTARY_CURRENT_VALIDATE.txt
          if [ "$app_code" -ne 0 ] || [ "$gas_code" -ne 0 ] || [ "$test_code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ELEMENTARY_CURRENT_RESULT.txt ELEMENTARY_CURRENT_VALIDATE.txt scripts/apply-20260831-elementary.mjs app.js styles.css index.html apps-script/Code.gs
            git commit -m "Record current-main elementary validation failure" || true
            git push origin HEAD:feature/elementary-school-current-20260831
            exit 1
          fi

      - name: Commit elementary support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html apps-script/Code.gs ELEMENTARY_CURRENT_RESULT.txt ELEMENTARY_CURRENT_VALIDATE.txt scripts/apply-20260831-elementary.mjs
          git commit -m "Add elementary school progress support to current main" || true
          git push origin HEAD:feature/elementary-school-current-20260831
