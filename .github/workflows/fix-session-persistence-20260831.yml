name: Fix session persistence 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-session-persistence-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align personal and shared session behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app_path = Path('app.js')
          index_path = Path('index.html')
          app = app_path.read_text()
          index = index_path.read_text()
          old = 'function persistSession() {\n  const data = JSON.stringify(state.session);\n  sessionStorage.removeItem(KEYS.session);\n  localStorage.removeItem(KEYS.local);\n  if (state.device === "personal" && $("rememberLogin")?.checked) localStorage.setItem(KEYS.local, data);\n  else sessionStorage.setItem(KEYS.session, data);\n  sessionStorage.setItem(KEYS.device, state.device);\n}'
          new = 'function persistSession() {\n  const data = JSON.stringify(state.session);\n  sessionStorage.removeItem(KEYS.session);\n  localStorage.removeItem(KEYS.local);\n  if (state.device === "personal") localStorage.setItem(KEYS.local, data);\n  else sessionStorage.setItem(KEYS.session, data);\n  sessionStorage.setItem(KEYS.device, state.device);\n  resetSharedIdleLogout();\n}'
          if old not in app:
              raise SystemExit('persistSession source not found')
          app = app.replace(old, new, 1)
          marker = 'let teacherSearchTimer = 0;\n'
          session_code = 'let sharedIdleTimer = 0;\nconst SHARED_IDLE_LOGOUT_MS = 30 * 60 * 1000;\nfunction resetSharedIdleLogout() {\n  if (sharedIdleTimer) clearTimeout(sharedIdleTimer);\n  sharedIdleTimer = 0;\n  if (!state.session || state.device !== "shared") return;\n  sharedIdleTimer = setTimeout(async () => {\n    try { await api("logout", {}, { silent: true }); } catch (_) {}\n    clearSessions();\n    location.reload();\n  }, SHARED_IDLE_LOGOUT_MS);\n}\n["pointerdown", "keydown", "touchstart"].forEach((eventName) => {\n  document.addEventListener(eventName, () => {\n    if (state.device === "shared" && state.session) resetSharedIdleLogout();\n  }, { passive: true });\n});\n'
          if marker not in app:
              raise SystemExit('timer insertion marker not found')
          app = app.replace(marker, marker + session_code, 1)
          clear_marker = 'function clearSessions() {\n'
          if clear_marker not in app:
              raise SystemExit('clearSessions marker not found')
          app = app.replace(clear_marker, 'function clearSessions() {\n  if (sharedIdleTimer) clearTimeout(sharedIdleTimer);\n  sharedIdleTimer = 0;\n', 1)
          restore_marker = '    state.device = parsed.deviceMode || sessionStorage.getItem(KEYS.device) || "personal";\n'
          if restore_marker not in app:
              raise SystemExit('restore marker not found')
          app = app.replace(restore_marker, restore_marker + '    resetSharedIdleLogout();\n', 1)
          old_device = '  if (state.device === "shared") $("rememberLogin").checked = false;'
          if old_device not in app:
              raise SystemExit('device remember marker not found')
          app = app.replace(old_device, '  $("rememberLogin").checked = state.device === "personal";', 1)
          index = index.replace('希望時だけログインを記憶', 'ログアウトするまでログインを保持')
          index = index.replace('<input id="rememberLogin" type="checkbox"><span>この端末でログイン状態を記憶する</span>', '<input id="rememberLogin" type="checkbox" checked disabled><span>ログアウトするまでログイン状態を保持します</span>')
          import re
          index = re.sub(r'app\.js\?v=[^\"\']+', 'app.js?v=20260831-session-persistence-1', index)
          app_path.write_text(app)
          index_path.write_text(index)
          test_path = Path('tests/final-hotpath.test.mjs')
          test = test_path.read_text()
          if 'SHARED_IDLE_LOGOUT_MS' not in test:
              test += '\nassert.ok(app.includes(\'if (state.device === "personal") localStorage.setItem(KEYS.local, data);\'));\nassert.ok(!app.includes(\'state.device === "personal" && $("rememberLogin")?.checked\'));\nassert.ok(app.includes(\'const SHARED_IDLE_LOGOUT_MS = 30 * 60 * 1000;\'));\nassert.ok(app.includes(\'function resetSharedIdleLogout()\'));\nassert.ok(app.includes(\'if (state.device === "shared" && state.session) resetSharedIdleLogout();\'));\nconst indexHtml = fs.readFileSync(new URL("../index.html", import.meta.url), "utf8");\nassert.ok(indexHtml.includes(\'ログアウトするまでログインを保持\'));\nassert.ok(indexHtml.includes(\'ログアウトするまでログイン状態を保持します\'));\n'
          test_path.write_text(test)
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check tests/final-hotpath.test.mjs
          npm test
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/final-hotpath.test.mjs
          git commit -m "Align personal and shared session persistence" || exit 0
          git push origin HEAD:main
