name: Fix session persistence 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-session-persistence-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align personal and shared session behavior
        run: |
          node <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('app.js','utf8');
          let index=fs.readFileSync('index.html','utf8');

          const oldPersist=`function persistSession() {
  const data = JSON.stringify(state.session);
  sessionStorage.removeItem(KEYS.session);
  localStorage.removeItem(KEYS.local);
  if (state.device === "personal" && $("rememberLogin")?.checked) localStorage.setItem(KEYS.local, data);
  else sessionStorage.setItem(KEYS.session, data);
  sessionStorage.setItem(KEYS.device, state.device);
}`;
          const newPersist=`function persistSession() {
  const data = JSON.stringify(state.session);
  sessionStorage.removeItem(KEYS.session);
  localStorage.removeItem(KEYS.local);
  if (state.device === "personal") localStorage.setItem(KEYS.local, data);
  else sessionStorage.setItem(KEYS.session, data);
  sessionStorage.setItem(KEYS.device, state.device);
  resetSharedIdleLogout();
}`;
          if(!app.includes(oldPersist)) throw new Error('persistSession source not found');
          app=app.replace(oldPersist,newPersist);

          const marker='let teacherSearchTimer = 0;\n';
          if(!app.includes(marker)) throw new Error('timer insertion marker not found');
          const sessionCode=`let sharedIdleTimer = 0;
const SHARED_IDLE_LOGOUT_MS = 30 * 60 * 1000;
function resetSharedIdleLogout() {
  if (sharedIdleTimer) clearTimeout(sharedIdleTimer);
  sharedIdleTimer = 0;
  if (!state.session || state.device !== "shared") return;
  sharedIdleTimer = setTimeout(async () => {
    try { await api("logout", {}, { silent: true }); } catch (_) {}
    clearSessions();
    location.reload();
  }, SHARED_IDLE_LOGOUT_MS);
}
["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
  document.addEventListener(eventName, () => {
    if (state.device === "shared" && state.session) resetSharedIdleLogout();
  }, { passive: true });
});
`;
          app=app.replace(marker,marker+sessionCode);

          const clearMarker='function clearSessions() {\n';
          if(!app.includes(clearMarker)) throw new Error('clearSessions marker not found');
          app=app.replace(clearMarker,'function clearSessions() {\n  if (sharedIdleTimer) clearTimeout(sharedIdleTimer);\n  sharedIdleTimer = 0;\n');

          const restoreMarker='    state.device = parsed.deviceMode || sessionStorage.getItem(KEYS.device) || "personal";\n';
          if(!app.includes(restoreMarker)) throw new Error('restore device marker not found');
          app=app.replace(restoreMarker,restoreMarker+'    resetSharedIdleLogout();\n');

          const deviceOld='  if (state.device === "shared") $("rememberLogin").checked = false;';
          const deviceNew='  $("rememberLogin").checked = state.device === "personal";';
          if(!app.includes(deviceOld)) throw new Error('device remember marker not found');
          app=app.replace(deviceOld,deviceNew);

          index=index.replace('<button class="deviceChoice" data-device="personal"><strong>自分の端末</strong><small>希望時だけログインを記憶</small></button>', '<button class="deviceChoice" data-device="personal"><strong>自分の端末</strong><small>ログアウトするまでログインを保持</small></button>');
          index=index.replace('<label id="rememberRow" class="checkRow hidden"><input id="rememberLogin" type="checkbox"><span>この端末でログイン状態を記憶する</span></label>', '<label id="rememberRow" class="checkRow hidden"><input id="rememberLogin" type="checkbox" checked disabled><span>ログアウトするまでログイン状態を保持します</span></label>');
          index=index.replace(/app\.js\?v=[^\"']+/g,'app.js?v=20260831-session-persistence-1');

          fs.writeFileSync('app.js',app);
          fs.writeFileSync('index.html',index);

          const p='tests/final-hotpath.test.mjs';
          let t=fs.readFileSync(p,'utf8');
          if(!t.includes('SHARED_IDLE_LOGOUT_MS')) {
            t += `\nassert.ok(app.includes('if (state.device === "personal") localStorage.setItem(KEYS.local, data);'));\nassert.ok(!app.includes('state.device === "personal" && $("rememberLogin")?.checked'));\nassert.ok(app.includes('const SHARED_IDLE_LOGOUT_MS = 30 * 60 * 1000;'));\nassert.ok(app.includes('function resetSharedIdleLogout()'));\nassert.ok(app.includes('if (state.device === "shared" && state.session) resetSharedIdleLogout();'));\nconst indexHtml = fs.readFileSync(new URL("../index.html", import.meta.url), "utf8");\nassert.ok(indexHtml.includes('ログアウトするまでログインを保持'));\nassert.ok(indexHtml.includes('ログアウトするまでログイン状態を保持します'));\n`;
          }
          fs.writeFileSync(p,t);
          NODE
      - name: Validate
        run: |
          node --check app.js
          node --check tests/final-hotpath.test.mjs
          npm test
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/final-hotpath.test.mjs
          git commit -m "Align personal and shared session persistence" || exit 0
          git push origin HEAD:main
