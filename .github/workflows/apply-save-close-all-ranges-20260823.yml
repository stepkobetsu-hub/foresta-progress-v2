name: Apply five-subject student dashboard with proven runner

on:
  push:
    branches: [main]
    paths:
      - save-close-all-ranges-trigger.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-five-subject-dashboard-proven
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dashboard patch and test
        shell: bash
        run: |
          set +e
          node scripts/apply-20260823-five-subject-student-dashboard.mjs > FIVE_SUBJECT_DASHBOARD_DIAG.txt 2>&1
          patch_code=$?
          echo "patch_exit=$patch_code" >> FIVE_SUBJECT_DASHBOARD_DIAG.txt
          if [ "$patch_code" -eq 0 ]; then
            npm test >> FIVE_SUBJECT_DASHBOARD_DIAG.txt 2>&1
            test_code=$?
            echo "test_exit=$test_code" >> FIVE_SUBJECT_DASHBOARD_DIAG.txt
            node --check app.js >> FIVE_SUBJECT_DASHBOARD_DIAG.txt 2>&1
            parse_code=$?
            echo "parse_exit=$parse_code" >> FIVE_SUBJECT_DASHBOARD_DIAG.txt
          else
            test_code=99
            parse_code=99
          fi
          echo "PATCH_CODE=$patch_code" >> "$GITHUB_ENV"
          echo "TEST_CODE=$test_code" >> "$GITHUB_ENV"
          echo "PARSE_CODE=$parse_code" >> "$GITHUB_ENV"
          cat FIVE_SUBJECT_DASHBOARD_DIAG.txt
      - name: Commit verified dashboard or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FIVE_SUBJECT_DASHBOARD_DIAG.txt
          if [ "$PATCH_CODE" = "0" ] && [ "$TEST_CODE" = "0" ] && [ "$PARSE_CODE" = "0" ]; then
            grep -q 'studentComparisonMiniHtml(data)' app.js
            grep -q 'studentFiveSubjectGraph' app.js
            grep -q 'five-subject student dashboard' styles.css
            grep -q 'app.js?v=20260823-five-subject-dashboard' index.html
            git add app.js styles.css index.html
            git commit -m "Improve five-subject student dashboard"
          else
            git commit -m "Record five-subject dashboard diagnostics"
          fi
          git push origin HEAD:main
