name: Apply self-study delete and moss graph

on:
  push:
    branches: [main]
    paths:
      - save-close-all-ranges-trigger.txt

permissions:
  contents: write

concurrency:
  group: foresta-progress-v2-self-delete-moss
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch and verify
        shell: bash
        run: |
          set +e
          node scripts/apply-20260823-self-delete-moss.mjs > SELF_DELETE_MOSS_DIAG.txt 2>&1
          patch_code=$?
          echo "patch_exit=$patch_code" >> SELF_DELETE_MOSS_DIAG.txt
          if [ "$patch_code" -eq 0 ]; then
            npm test >> SELF_DELETE_MOSS_DIAG.txt 2>&1
            test_code=$?
            echo "test_exit=$test_code" >> SELF_DELETE_MOSS_DIAG.txt
            node --check app.js >> SELF_DELETE_MOSS_DIAG.txt 2>&1
            app_parse=$?
            echo "app_parse_exit=$app_parse" >> SELF_DELETE_MOSS_DIAG.txt
            cp apps-script/Code.gs /tmp/Code.js
            node --check /tmp/Code.js >> SELF_DELETE_MOSS_DIAG.txt 2>&1
            gas_parse=$?
            echo "gas_parse_exit=$gas_parse" >> SELF_DELETE_MOSS_DIAG.txt
          else
            test_code=99; app_parse=99; gas_parse=99
          fi
          echo "PATCH_CODE=$patch_code" >> "$GITHUB_ENV"
          echo "TEST_CODE=$test_code" >> "$GITHUB_ENV"
          echo "APP_PARSE=$app_parse" >> "$GITHUB_ENV"
          echo "GAS_PARSE=$gas_parse" >> "$GITHUB_ENV"
          cat SELF_DELETE_MOSS_DIAG.txt
      - name: Commit verified source or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SELF_DELETE_MOSS_DIAG.txt
          if [ "$PATCH_CODE" = "0" ] && [ "$TEST_CODE" = "0" ] && [ "$APP_PARSE" = "0" ] && [ "$GAS_PARSE" = "0" ]; then
            grep -q "version: '2.3.1'" apps-script/Code.gs
            grep -q "\['teacher','student'\]" apps-script/Code.gs
            grep -q 'group.source === "self"' app.js
            grep -q 'linear-gradient(135deg,#42583d' styles.css
            grep -q 'app.js?v=20260823-moss-self-delete' index.html
            git add app.js styles.css index.html apps-script/Code.gs deploy-apps-script.html
            git commit -m "Allow student self-study delete and use moss graph"
          else
            git commit -m "Record self-delete moss diagnostics"
          fi
          git push origin HEAD:main
