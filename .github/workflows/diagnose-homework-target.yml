name: Diagnose homework target
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-homework-target.py
      - .github/workflows/diagnose-homework-target.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/diagnose-homework-target.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HOMEWORK_TARGET_DIAG.txt
          git commit -m "Record targeted homework diagnostic" || exit 0
          git push origin HEAD:main
