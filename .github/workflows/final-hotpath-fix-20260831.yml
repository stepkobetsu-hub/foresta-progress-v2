name: Final hotpath fix 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-hotpath-fix-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch final classroom hot paths
        run: |
          node <<'NODE'
          const fs = require('fs');

          let elem = fs.readFileSync('elementary-supabase.js','utf8');
          const oldHomework = "const result = await callElementary('addCustomHomework', { subject: form.querySelector('.elementaryCustomHomeworkSubject').value, customText: text, assignedDate: todayJst() });";
          const newHomework = "const result = await callElementary('addCustomHomework', { subject: form.querySelector('.elementaryCustomHomeworkSubject').value, memo: text, assignedDate: todayJst() });";
          if (elem.includes(oldHomework)) elem = elem.replace(oldHomework, newHomework);
          if (!elem.includes("memo: text, assignedDate: todayJst()")) throw new Error('custom homework memo patch failed');
          fs.writeFileSync('elementary-supabase.js', elem);

          let app = fs.readFileSync('app.js','utf8');
          const oldStatus = 'if (!silent) status(FAST_RUNTIME_ENABLED && usingFastRuntimeFor(action) ? "高速保存中…" : "読み込み中…");';
          const newStatus = 'if (!silent) status(FAST_RUNTIME_ENABLED && usingFastRuntimeFor(action) ? (FAST_RUNTIME_WRITE_ACTIONS.has(action) ? "高速保存中…" : "高速読込中…") : "読み込み中…");';
          if (app.includes(oldStatus)) app = app.replace(oldStatus, newStatus);
          if (!app.includes('FAST_RUNTIME_WRITE_ACTIONS.has(action) ? "高速保存中…" : "高速読込中…"')) throw new Error('read/save status patch failed');
          fs.writeFileSync('app.js', app);

          let index = fs.readFileSync('index.html','utf8');
          index = index.replace(/app\.js\?v=[^\"']+/g, 'app.js?v=20260831-final-hotpath-1');
          index = index.replace(/elementary-supabase\.js\?v=[^\"']+/g, 'elementary-supabase.js?v=20260831-final-hotpath-1');
          fs.writeFileSync('index.html', index);

          const test = `import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst app=fs.readFileSync(new URL("../app.js",import.meta.url),"utf8");\nconst elem=fs.readFileSync(new URL("../elementary-supabase.js",import.meta.url),"utf8");\nconst buttons=fs.readFileSync(new URL("../v3-homework-ui-fix.js",import.meta.url),"utf8");\nassert.match(app,/replace\\(\\/\\[ァ-ヶ\\]\\/g/);\nassert.match(app,/student\.reading/);\nassert.match(app,/student\.romaji/);\nassert.ok(app.includes('FAST_RUNTIME_WRITE_ACTIONS.has(action) ? "高速保存中…" : "高速読込中…"'));\nassert.ok(elem.includes('memo: text, assignedDate: todayJst()'));\nassert.ok(elem.includes('"教科書漢字ドリルなど"'));\nassert.ok(elem.includes('if (normalized === "国語") return loadJapaneseProgressions(grade);'));\nassert.ok(elem.includes('if (normalized === "国語") return ["本日の赤×なおし"]'));\nassert.ok(elem.includes('if (normalized === "算数" || normalized === "英語") return ["TRYの赤×なおし", "エクササイズ"]'));\nassert.ok(buttons.includes('次回宿題を確認・調整'));\nassert.ok(buttons.includes('進行表を開く'));\nassert.ok(!buttons.includes('宿題・進行表を訂正'));\nconsole.log("final hotpath regression tests: ok");\n`;
          fs.writeFileSync('tests/final-hotpath.test.mjs', test);
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!pkg.scripts.test.includes('final-hotpath.test.mjs')) pkg.scripts.test += ' && node tests/final-hotpath.test.mjs';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Validate and run all tests
        run: |
          node --check app.js
          node --check elementary-supabase.js
          node --check v3-homework-ui-fix.js
          node --check tests/final-hotpath.test.mjs
          npm test
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js elementary-supabase.js index.html package.json tests/final-hotpath.test.mjs
          git commit -m "Fix final classroom hot paths" || exit 0
          git push origin HEAD:main

# retry after making cache-buster assertion version-agnostic
