name: Fix elementary custom homework button 20260831

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-elementary-custom-homework-button-20260831.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-enable custom homework add button after save
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('elementary-supabase.js','utf8');
          const old="      status('その他の宿題を追加しました。');\n      await replaceElementaryHomework(dashboard, result);\n    } catch (error) {";
          const neu="      status('その他の宿題を追加しました。');\n      await replaceElementaryHomework(dashboard, result);\n      button.disabled = false;\n    } catch (error) {";
          if(!s.includes(old)) throw new Error('custom homework success path not found');
          s=s.replace(old,neu);
          fs.writeFileSync('elementary-supabase.js',s);

          const p='tests/role-colors-homework-navigation.test.mjs';
          let t=fs.readFileSync(p,'utf8');
          if(!t.includes("await replaceElementaryHomework(dashboard, result);\\n      button.disabled = false;")) {
            t += `\nassert.ok(elementary.includes("await replaceElementaryHomework(dashboard, result);\\n      button.disabled = false;"));\n`;
          }
          fs.writeFileSync(p,t);

          let index=fs.readFileSync('index.html','utf8');
          index=index.replace(/elementary-supabase\.js\?v=[^\"']+/g,'elementary-supabase.js?v=20260831-homework-page-filter-2');
          fs.writeFileSync('index.html',index);
          NODE
      - name: Validate
        run: |
          node --check elementary-supabase.js
          node --check tests/role-colors-homework-navigation.test.mjs
          npm test
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementary-supabase.js index.html tests/role-colors-homework-navigation.test.mjs
          git commit -m "Fix elementary custom homework repeat entry" || exit 0
          git push origin HEAD:main
