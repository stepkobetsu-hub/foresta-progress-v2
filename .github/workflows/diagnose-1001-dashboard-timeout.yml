name: Diagnose 1001 dashboard timeout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-1001-dashboard-timeout.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Measure live Apps Script for 1001
        shell: bash
        run: |
          set -euo pipefail
          API='https://script.google.com/macros/s/AKfycbz0z2FeM1jWUSs7LTzwi9N12kPoTmSTP_hRjTaf3wQlf5kX5hR_W9E37ON63L_dhbIZ/exec'
          START=$(date +%s%3N)
          LOGIN=$(curl -L --max-time 60 -sS -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"studentLogin","loginId":"1001","password":"kase","deviceMode":"shared"}' "$API")
          END=$(date +%s%3N)
          echo "login_ms=$((END-START))"
          TOKEN=$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("session",{}).get("token",""))' "$LOGIN")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True and d.get("session",{}).get("token"), d' "$LOGIN"
          START=$(date +%s%3N)
          DASH=$(curl -L --max-time 90 -sS -H 'Content-Type: text/plain;charset=utf-8' --data "{\"action\":\"getStudentDashboard\",\"token\":\"$TOKEN\"}" "$API")
          END=$(date +%s%3N)
          echo "dashboard_ms=$((END-START))"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); print("dashboard_ok=",d.get("ok"),"message=",d.get("message",""),"grade=",d.get("student",{}).get("grade",""))' "$DASH"
