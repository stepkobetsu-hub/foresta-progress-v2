name: Fix elementary teacher context

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-elementary-teacher-context-20260831.yml
      - scripts/fix-elementary-teacher-context.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-elementary-teacher-context.py
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js index.html
          git commit -m "Fix elementary teacher context detection"
          git push origin HEAD:main
