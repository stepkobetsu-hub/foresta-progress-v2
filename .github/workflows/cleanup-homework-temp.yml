name: Cleanup homework temporary files
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-homework-temp.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary homework tooling
        run: |
          rm -f HOMEWORK_DIAG.txt HOMEWORK_TARGET_DIAG.txt
          rm -f scripts/diagnose-homework-flow.py scripts/diagnose-homework-target.py scripts/unify-homework-subject-archive.py scripts/fix-homework-subject-picker.py
          rm -f .github/workflows/diagnose-homework-flow.yml .github/workflows/diagnose-homework-target.yml .github/workflows/unify-homework-subject-archive.yml .github/workflows/fix-homework-subject-picker.yml .github/workflows/cleanup-homework-temp.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary homework maintenance files" || exit 0
          git push origin HEAD:main
