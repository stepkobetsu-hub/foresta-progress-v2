name: Apply elementary home improvements

on:
  push:
    branches: [feature/elementary-home-20260831]
    paths:
      - .github/workflows/apply-elementary-home-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/elementary-home-20260831
          fetch-depth: 0

      - name: Patch elementary UI and static progression fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('app.js')
          css_path=Path('styles.css')
          gas_path=Path('apps-script/Code.gs')
          app=app_path.read_text()
          css=css_path.read_text()
          gas=gas_path.read_text()

          # Export the already-reviewed elementary progression constant for a browser-side display fallback.
          m=re.search(r'const ELEMENTARY_PROGRESSIONS_=(\{.*?\});\nfunction isElementaryGrade_', gas, re.S)
          if not m:
              raise SystemExit('ELEMENTARY_PROGRESSIONS_ not found')
          Path('elementary-progressions.js').write_text('export const ELEMENTARY_PROGRESSIONS = '+m.group(1)+';\n')

          if 'elementary-progressions.js' not in app:
              app=app.replace('import { CONFIG } from "./config.js";\n', 'import { CONFIG } from "./config.js";\nimport { ELEMENTARY_PROGRESSIONS } from "./elementary-progressions.js";\n', 1)

          old_load=re.search(r'async function loadProgression\(options, \{ force = false \} = \{\}\) \{.*?\n\}\n\nfunction prefetchProgression', app, re.S)
          if not old_load:
              raise SystemExit('loadProgression block not found')
          new_load='''async function loadProgression(options, { force = false } = {}) {
  const key = progressionCacheKey(options);
  if (!force) {
    const cached = readProgressionCache(options);
    if (cached) return cached;
    if (state.progressionPromises.has(key)) return state.progressionPromises.get(key);
  }
  const action = options.mode === "range" ? "getRangeEditor" : "getProgression";
  const request = api(action, options, { silent: true })
    .then((data) => {
      const fallback = elementaryLocalProgression(options);
      const resolved = fallback && !data?.summary?.elementary ? fallback : data;
      return writeProgressionCache(options, resolved);
    })
    .catch((error) => {
      const fallback = elementaryLocalProgression(options);
      if (fallback) return writeProgressionCache(options, fallback);
      throw error;
    })
    .finally(() => state.progressionPromises.delete(key));
  state.progressionPromises.set(key, request);
  return request;
}

function prefetchProgression'''
          app=app[:old_load.start()]+new_load+app[old_load.end():]

          anchor='const ELEMENTARY_HOMEWORK={算数:["TRYの赤×なおし","エクササイズ"],英語:["TRYの赤×なおし","エクササイズ"],国語:["本日の赤×なおし"]};\n'
          if anchor not in app:
              raise SystemExit('elementary helper anchor not found')
          helpers=r'''
const ELEMENTARY_MAIN_SUBJECTS=["算数","国語","英語"];
function normalizeElementarySubject(v){const s=String(v||"").trim();return s==="数学"?"算数":s;}
function elementaryEnglishKey(v){const s=String(v||"").normalize("NFKC").toUpperCase().replace(/\s+/g,"");if(s==="3"||s.includes("III"))return"Ⅲ";if(s==="2"||s.includes("II"))return"Ⅱ";if(s==="1"||s.includes("I"))return"Ⅰ";return"";}
function elementaryRegisteredSubjects(data){const raw=[...(data?.elementary?.subjects||[]),...(data?.student?.subjects||[])].map(normalizeElementarySubject).filter(s=>ELEMENTARY_MAIN_SUBJECTS.includes(s));const unique=[...new Set(raw)];return unique.length?ELEMENTARY_MAIN_SUBJECTS.filter(s=>unique.includes(s)):["算数"];}
function elementaryStaticUnits(data,subject){const grade=String(data?.student?.grade||data?.grade||"").normalize("NFKC").replace(/年$/u,"");if(subject==="算数")return ELEMENTARY_PROGRESSIONS.math?.[grade]||[];if(subject==="英語"){const level=elementaryEnglishKey(data?.student?.englishLevel||data?.englishLevel);return ELEMENTARY_PROGRESSIONS.english?.[level]||[];}return[];}
function elementaryRows(data){const existing=data?.progress||[];return elementaryRegisteredSubjects(data).map(subject=>{const direct=existing.find(r=>normalizeElementarySubject(r.subject)===subject)||{};const unitOptions=(direct.unitOptions?.length?direct.unitOptions:elementaryStaticUnits(data,subject).map(u=>({unitId:u.unitId,unitNumber:u.unitNumber,unitName:u.unitName,chapter:u.chapter})));return{...direct,subject,unitOptions};});}
function elementaryLocalProgression(options){const grade=String(options?.grade||"").normalize("NFKC").replace(/年$/u,"");if(!isElementaryGradeValue(grade)||!["算数","英語"].includes(normalizeElementarySubject(options?.subject)))return null;const subject=normalizeElementarySubject(options.subject);const holder={student:{grade,englishLevel:options.englishLevel||""}};const units=elementaryStaticUnits(holder,subject);if(!units.length)return null;const textbook=subject==="算数"?"啓林館":"フォレスタ小学英語"+(elementaryEnglishKey(options.englishLevel)||"");return{title:`${grade} ${subject} / ${textbook}`,selectedUnitIds:[],summary:{subject,textbook,elementary:true},units:units.map(u=>({...u,omittable:false,learned:false,lessonDates:[],previous:false,schoolPosition:false,predictedOutside:false,decidedOutside:false,ctResult:""}))};}
'''
          if 'const ELEMENTARY_MAIN_SUBJECTS=' not in app:
              app=app.replace(anchor,anchor+helpers,1)

          student_block=re.search(r'function elementaryDiffClass\(v\).*?\nfunction homeworkDisplayInfo', app, re.S)
          if not student_block:
              raise SystemExit('elementary student block not found')
          student_new=r'''function elementaryDiffClass(v){return v>0?"ahead":v<0?"behind":v===0?"same":"unset"}
function elementaryTestsHtml(tests){const rows=(tests||[]).slice(0,10);if(!rows.length)return '<div class="emptyState">学校の単元テストはまだ登録されていません。</div>';return '<div class="tableWrap"><table><thead><tr><th>日付</th><th>科目</th><th>単元</th><th>点数</th></tr></thead><tbody>'+rows.map(t=>`<tr><td>${esc(fmtShortDate(t.testDate))}</td><td>${esc(t.subject)}</td><td>${esc(t.unitName||"")}</td><td><strong class="elementaryScore">${esc(t.score)}/${esc(t.maxScore||100)}</strong></td></tr>`).join('')+'</tbody></table></div>'}
function renderElementaryStudent(data){const rows=elementaryRows(data), extras=(data.progress||[]).filter(r=>["理科","社会"].includes(r.subject));const extraHtml=extras.length?`<details class="elementaryExtraSubjects"><summary>その他（理科・社会）</summary><p>小学生では通常使用しないため折りたたんでいます。</p></details>`:"";$("content").innerHTML=`<header class="pageHead"><div><span class="elementaryKicker">小学生</span><h1>${esc(data.student.name)}さんの進捗</h1><p>${esc(data.student.school||"学校未登録")} / ${esc(data.student.grade)}　受講科目を中心に、学校との差を単元数で確認します。</p></div></header><section class="elementaryProgressGrid elementaryMainSubjects">${rows.map(r=>`<article class="card elementarySubjectCard ${subjectProgressClass(r.subject)}"><div class="elementaryCardHead"><span class="subjectPill">${esc(r.subject)}</span><strong class="elementaryDifference ${elementaryDiffClass(r.differenceUnits)}">${esc(r.differenceLabel||"未設定")}</strong></div><p><small>学校</small><br><strong>${esc(r.schoolUnitName||"未入力")}</strong></p><p><small>塾</small><br><strong>${esc(r.forestaUnitName||"未入力")}</strong></p><p>直近テスト：${r.latestUnitTest?`<strong class="elementaryScore">${esc(r.latestUnitTest.score)}点</strong>`:"未登録"}</p>${r.unitOptions?.length?`<button class="secondaryBtn elementaryStudentProgress" data-subject="${esc(r.subject)}">進行表を見る</button>`:`<button class="ghostBtn" disabled>進行表準備中</button>`}</article>`).join('')}</section>${extraHtml}<section class="cardGrid"><article class="card span12"><p class="cardTitle">最近の学校単元テスト</p>${elementaryTestsHtml(data.elementary?.unitTests||[])}</article><article class="card span12"><div class="homeworkPanelHead"><p class="cardTitle">次回までの宿題</p><button id="openHomeworkArchiveHome" class="ghostBtn">アーカイブ</button></div><div class="homeworkList">${homeworkHtml(data.homework||[],"student")}</div></article></section>`;$("content").querySelectorAll(".elementaryStudentProgress").forEach(b=>b.onclick=()=>openProgress({subject:b.dataset.subject,mode:"view",grade:data.student.grade,englishLevel:data.student.englishLevel}));bindHomeworkChecks();bindHomeworkArchiveActions("student");$("openHomeworkArchiveHome")?.addEventListener("click",()=>openView("homeworkArchive"))}

function homeworkDisplayInfo'''
          app=app[:student_block.start()]+student_new+app[student_block.end():]

          teacher_block=re.search(r'function elemOptions\(r\).*?\nfunction openElementaryUnitTestForm', app, re.S)
          if not teacher_block:
              raise SystemExit('elementary teacher block not found')
          teacher_new=r'''function elemOptions(r){return '<option value="">学校進度を選ぶ</option>'+(r.unitOptions||[]).map(u=>`<option value="${esc(u.unitId)}" ${u.unitId===r.schoolUnitId?"selected":""}>${esc([u.unitNumber,u.unitName].filter(Boolean).join(" "))}</option>`).join('')}
function elementaryQuickTestHtml(rows){const subjects=rows.map(r=>r.subject);return `<article class="card elementaryQuickTestCard"><div class="elementaryQuickTestHead"><div><p class="cardTitle">学校の単元テスト入力</p><p class="muted">最近の算数・国語のテストを聞き取り、その場で入力します。</p></div></div><form id="elementaryQuickTestForm" class="elementaryQuickTestForm"><label>科目<select id="elementaryQuickSubject" class="field">${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label id="elementaryQuickUnitWrap">単元<select id="elementaryQuickUnit" class="field"></select></label><label id="elementaryQuickUnitFreeWrap" class="hidden">単元名<input id="elementaryQuickUnitFree" class="field" maxlength="80" placeholder="例：割合"></label><label>点数<input id="elementaryQuickScore" class="field" type="number" min="0" max="999" required placeholder="点"></label><label>満点<input id="elementaryQuickMax" class="field" type="number" min="1" max="999" value="100"></label><label>テスト日<input id="elementaryQuickDate" class="field" type="date" value="${dateInputValue(new Date())}"></label><button class="primaryBtn" type="submit">保存</button></form><output id="elementaryQuickStatus" class="lessonSaveStatus" aria-live="polite"></output></article>`;}
function bindElementaryQuickTest(data,studentId,rows){const form=$("elementaryQuickTestForm");if(!form)return;const refresh=()=>{const r=rows.find(x=>x.subject===$("elementaryQuickSubject").value)||{},units=r.unitOptions||[];$("elementaryQuickUnit").innerHTML='<option value="">単元を選ぶ</option>'+units.map(u=>`<option value="${esc(u.unitId)}" ${u.unitId===r.schoolUnitId?"selected":""}>${esc([u.unitNumber,u.unitName].filter(Boolean).join(" "))}</option>`).join('');$("elementaryQuickUnitWrap").classList.toggle("hidden",!units.length);$("elementaryQuickUnitFreeWrap").classList.toggle("hidden",!!units.length)};$("elementaryQuickSubject").onchange=refresh;refresh();form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button[type="submit"]'),hasUnits=!$("elementaryQuickUnitWrap").classList.contains("hidden");btn.disabled=true;$("elementaryQuickStatus").textContent="保存しています…";try{await api("saveElementaryUnitTest",{studentId,subject:$("elementaryQuickSubject").value,unitId:hasUnits?$("elementaryQuickUnit").value:"",unitName:hasUnits?"":$("elementaryQuickUnitFree").value.trim(),testDate:$("elementaryQuickDate").value,score:$("elementaryQuickScore").value,maxScore:$("elementaryQuickMax").value||100,memo:""},{silent:true});delete state.teacherStudentCache[String(studentId)];state.dashboard=null;status("学校の単元テストを保存しました。");await renderTeacherStudent(studentId,{force:true})}catch(err){$("elementaryQuickStatus").textContent=err.message;btn.disabled=false}}}
function renderElementaryTeacherStudent(data,studentId){const rows=elementaryRows(data), summary=homeworkCompletionSummary(data.homework||[]), teachers=(data.teacherCandidates||[]).map(t=>`<option value="${esc(t.loginId)}" ${String(t.loginId)===String(state.session.loginId)?"selected":""}>${esc(t.name)}</option>`).join('');$("content").innerHTML=`${selectedTabsHtml()}<header class="pageHead"><div><span class="elementaryKicker">小学生</span><h1>${esc(data.student.name)}</h1><p>${esc(data.student.studentId)} / ${esc(data.student.campus)} / ${esc(data.student.grade)} / ${esc(data.student.school||"学校未登録")}</p></div></header><article class="card elementaryTeacherGuide"><strong>授業前に確認</strong><span>①学校はどこまで進んだか　②最近の学校単元テストは何点だったか</span></article>${elementaryQuickTestHtml(rows)}<div class="elementaryTeacherToolbar"><label>担当講師<select id="elementaryLessonTeacher" class="field">${teachers}</select></label><button id="correctElementaryLesson" class="ghostBtn">宿題・進行表を訂正</button></div><section class="elementaryProgressGrid elementaryMainSubjects">${rows.map(r=>`<article class="card elementarySubjectCard ${subjectProgressClass(r.subject)}"><div class="elementaryCardHead"><span class="subjectPill">${esc(r.subject)}</span><strong class="elementaryDifference ${elementaryDiffClass(r.differenceUnits)}">${esc(r.differenceLabel||"未設定")}</strong></div><label class="elementarySchoolSelect">学校の現在地<select class="field elementarySchoolPosition" data-subject="${esc(r.subject)}">${elemOptions(r)}</select><small>選ぶと自動保存</small></label><p><small>塾の現在地</small><br><strong>${esc(r.forestaUnitName||"未入力")}</strong></p><p>直近の学校単元テスト：${r.latestUnitTest?`<strong class="elementaryScore">${esc(r.latestUnitTest.score)}点</strong>`:"未登録"}</p><div class="actionRow">${r.unitOptions?.length?`<button class="secondaryBtn elementaryOpenProgress" data-subject="${esc(r.subject)}">進行表を開く</button>`:`<button class="ghostBtn" disabled>進行表準備中</button>`}</div></article>`).join('')}</section><section class="cardGrid"><article class="card span7"><p class="cardTitle">最近の学校単元テスト</p>${elementaryTestsHtml(data.elementary?.unitTests||[])}</article><article class="card span5"><div class="homeworkPanelHead"><p class="cardTitle">前回宿題</p><button id="openTeacherHomeworkArchive" class="ghostBtn">アーカイブ</button></div><p class="muted">完了 ${summary.completed}/${summary.total}</p><div class="homeworkList">${homeworkHtml(data.homework||[],"teacher")}</div></article></section>`;bindSelectedTabs();bindElementaryQuickTest(data,studentId,rows);$("content").querySelectorAll(".elementaryOpenProgress").forEach(b=>b.onclick=()=>openProgress({subject:b.dataset.subject,mode:"lesson",studentId,teacherId:$("elementaryLessonTeacher")?.value||state.session.loginId,grade:data.student.grade,englishLevel:data.student.englishLevel}));$("content").querySelectorAll(".elementarySchoolPosition").forEach(s=>s.onchange=async()=>{if(!s.value)return;s.disabled=true;try{await api("saveSchoolPosition",{studentId,subject:s.dataset.subject,unitId:s.value,recordedDate:dateInputValue(new Date())},{silent:true});delete state.teacherStudentCache[String(studentId)];state.dashboard=null;status("学校進度を保存しました。");await renderTeacherStudent(studentId,{force:true})}catch(e){status(e.message,true);s.disabled=false}});$("correctElementaryLesson")?.addEventListener("click",()=>openLessonCorrection(studentId));bindTeacherHomeworkChecks();bindHomeworkArchiveActions("teacher");$("openTeacherHomeworkArchive")?.addEventListener("click",()=>{state.activeView="selectedArchive";openView("selectedArchive")})}
function openElementaryUnitTestForm'''
          app=app[:teacher_block.start()]+teacher_new+app[teacher_block.end():]

          css_add=r'''

/* Elementary-school home: prioritize enrolled subjects and fast school-test entry. */
.elementaryMainSubjects{grid-template-columns:repeat(3,minmax(0,1fr));}
.elementaryExtraSubjects{margin:10px 0 18px;border:1px solid #d7e1df;border-radius:14px;background:#fff;padding:10px 14px;color:#52645f;}
.elementaryExtraSubjects summary{cursor:pointer;font-weight:700;color:#315b54;}
.elementaryExtraSubjects p{margin:8px 0 2px;font-size:.88rem;}
.elementaryQuickTestCard{margin:14px 0 16px;padding:18px;}
.elementaryQuickTestHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;}
.elementaryQuickTestHead p{margin:0;}
.elementaryQuickTestForm{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(220px,1.7fr) minmax(90px,.6fr) minmax(90px,.6fr) minmax(150px,.8fr) auto;gap:10px;align-items:end;}
.elementaryQuickTestForm label{display:grid;gap:5px;font-size:.78rem;font-weight:700;color:#445c56;}
.elementaryQuickTestForm .primaryBtn{white-space:nowrap;min-height:42px;}
@media(max-width:1050px){.elementaryMainSubjects{grid-template-columns:repeat(2,minmax(0,1fr));}.elementaryQuickTestForm{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:720px){.elementaryMainSubjects{grid-template-columns:1fr}.elementaryQuickTestForm{grid-template-columns:1fr 1fr}.elementaryQuickTestForm label:nth-child(2){grid-column:1/-1}.elementaryQuickTestForm .primaryBtn{grid-column:1/-1}}
'''
          if 'Elementary-school home: prioritize enrolled subjects' not in css:
              css += css_add

          app_path.write_text(app)
          css_path.write_text(css)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check elementary-progressions.js
          cp apps-script/Code.gs /tmp/foresta-code.js
          node --check /tmp/foresta-code.js
          npm test

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css elementary-progressions.js
          git commit -m "Improve elementary home and progression display"
          git push origin HEAD:feature/elementary-home-20260831
