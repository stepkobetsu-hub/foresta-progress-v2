name: Fix homework subject picker
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-homework-subject-picker.py
      - .github/workflows/fix-homework-subject-picker.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-homework-subject-picker.py
      - run: node --check app.js
      - run: node --check elementary-supabase.js
      - run: npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js elementary-supabase.js index.html
          git commit -m "Prefer lesson subject for teacher homework filter" || exit 0
          git push origin HEAD:main
