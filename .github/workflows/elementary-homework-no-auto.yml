name: Elementary homework no auto finalize
on:
  push:
    branches: [main]
    paths:
      - scripts/elementary-homework-no-auto.py
      - .github/workflows/elementary-homework-no-auto.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/elementary-homework-no-auto.py
      - run: node --check elementary-supabase.js
      - run: npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js index.html
          git commit -m "Use middle-school style homework confirmation for elementary" || exit 0
          git push origin HEAD:main
