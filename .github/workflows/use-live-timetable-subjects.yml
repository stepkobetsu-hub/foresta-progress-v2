name: Use live timetable subjects
on:
  push:
    branches: [main]
    paths:
      - scripts/use-live-timetable-subjects.py
      - .github/workflows/use-live-timetable-subjects.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/use-live-timetable-subjects.py
      - run: cp apps-script/Code.gs /tmp/foresta-code.js && node --check /tmp/foresta-code.js
      - run: npm test
      - name: Commit live timetable source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps-script/Code.gs tests/gas-pure.test.mjs
          git commit -m "Read current subjects directly from timetable master"
          git push origin HEAD:main
