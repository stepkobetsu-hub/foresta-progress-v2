name: Elementary homework adjustment flow
on:
  push:
    branches: [main]
    paths:
      - scripts/elementary-homework-adjust-flow.py
      - .github/workflows/elementary-homework-adjust-flow.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/elementary-homework-adjust-flow.py
      - run: node --check elementary-supabase.js
      - run: node --check app.js
      - run: npm test
      - name: Commit homework adjustment flow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add elementary-supabase.js elementary-supabase.css index.html
          git commit -m "Let teachers reduce elementary homework before finalizing" || exit 0
          git push origin HEAD:main
