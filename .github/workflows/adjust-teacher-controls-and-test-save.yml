name: Adjust teacher controls and test save
on:
  push:
    branches: [main]
    paths:
      - scripts/adjust-teacher-controls-and-test-save.py
      - .github/workflows/adjust-teacher-controls-and-test-save.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/adjust-teacher-controls-and-test-save.py
      - run: node --check app.js
      - run: npm test
      - name: Commit teacher controls and test save layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css elementary-enhancement.css index.html
          git commit -m "Improve student change controls and test save placement"
          git push origin HEAD:main
