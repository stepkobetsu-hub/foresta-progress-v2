name: Apply V3 homework archive and toolbar fix

on:
  push:
    branches: [codex/fix-homework-archive-buttons-20260831]
    paths:
      - scripts/apply-homework-archive-buttons-fix-20260831.mjs
      - .github/workflows/apply-homework-archive-buttons-fix-20260831.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-homework-archive-buttons-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/apply-homework-archive-buttons-fix-20260831.mjs
      - name: Syntax and tests
        run: |
          node --check app.js
          node --check elementary-supabase.js
          cp apps-script/Code.gs /tmp/Code.js && node --check /tmp/Code.js
          npm test
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html supabase/functions/foresta-runtime-v3/index.ts supabase/migrations/202608310006_homework_archive_read_model.sql tests/v3-homework-archive-buttons.test.mjs
          git commit -m 'Fix V3 homework archive and split teacher actions'
          git push origin HEAD:codex/fix-homework-archive-buttons-20260831
