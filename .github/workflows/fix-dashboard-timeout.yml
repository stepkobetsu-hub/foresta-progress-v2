name: Fix dashboard timeout
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-dashboard-timeout.py
      - .github/workflows/fix-dashboard-timeout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-dashboard-timeout.py
      - run: node --check app.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.js app.js index.html
          git commit -m "Allow slow initial dashboard response without false timeout"
          git push origin HEAD:main
