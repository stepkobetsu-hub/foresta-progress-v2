name: Fix elementary label date history
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-elementary-label-date-history.py
      - .github/workflows/fix-elementary-label-date-history.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/fix-elementary-label-date-history.py
      - run: node --check app.js
      - run: node --check elementary-supabase.js
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js elementary-supabase.js elementary-supabase.css index.html
          git commit -m "Normalize elementary math label, show dated checks, and compact test history"
          git push origin HEAD:main
