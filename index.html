<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13795b">
  <title>フォレスタ進捗管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <header class="app-header">
    <button id="homeButton" class="brand" type="button" aria-label="トップへ">
      <span class="brand-mark">F</span><span>フォレスタ進捗管理</span>
    </button>
    <div id="userBadge" class="user-badge hidden"></div>
  </header>

  <main id="app" class="app-shell">
    <section id="loginView" class="login-view">
      <div class="hero-card">
        <p class="eyebrow">FORESTA PROGRESS</p>
        <h1>今日の一歩を、<br>テストの自信へ。</h1>
        <p class="hero-copy">授業・宿題・学校進度をひとつにまとめて、次にやることを迷わない。</p>
      </div>

      <div class="login-card">
        <div class="role-tabs" role="tablist" aria-label="ログイン種別">
          <button class="role-tab active" data-role="student" role="tab" aria-selected="true">生徒用</button>
          <button class="role-tab" data-role="teacher" role="tab" aria-selected="false">講師用</button>
        </div>

        <fieldset class="device-choice">
          <legend>この端末は？</legend>
          <label><input type="radio" name="device" value="personal" checked> 自分のスマートフォン・タブレット</label>
          <label><input type="radio" name="device" value="shared"> 塾の共用端末</label>
        </fieldset>

        <form id="loginForm" class="login-form">
          <label><span id="loginIdLabel">生徒ID</span><input id="loginId" autocomplete="username" required></label>
          <label><span>パスワード</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <button id="loginButton" class="primary-button" type="submit">ログイン</button>
          <p id="loginStatus" class="form-status" aria-live="polite"></p>
        </form>

        <button id="demoButton" class="text-button" type="button">画面デモを開く</button>
        <button id="adminButton" class="admin-link" type="button">管理者ページ</button>
      </div>
    </section>

    <section id="workspace" class="workspace hidden">
      <nav id="mainNav" class="main-nav" aria-label="メインメニュー"></nav>
      <div id="screen" class="screen"></div>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-head"><h2 id="dialogTitle">詳細</h2><button id="dialogClose" class="icon-button" aria-label="閉じる">×</button></div>
    <div id="dialogBody"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
