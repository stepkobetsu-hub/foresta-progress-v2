<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="学校別・教科書別に先取り学習を管理するフォレスタ進捗管理">
  <title>フォレスタ進捗管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20260815-teacher-details">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="フォレスタ進捗管理 ホーム"><span class="brandMark">F</span><span>フォレスタ進捗管理</span></a>
    <a class="goalLink" href="https://stepkobetsu-hub.github.io/foresta-step-progress/" target="_blank" rel="noopener">フォレスタ＆ゴールへ ↗</a>
  </header>

  <main id="app" class="appShell">
    <section id="loginView" class="loginLayout">
      <div class="heroCard">
        <span class="eyebrow">学校の一歩先へ</span>
        <h1>次のテストまでの道のりを、<br>一つずつ見える形に。</h1>
        <p>フォレスタ進行表を、学校・学年・教科書・受講レベルに合わせて表示します。</p>
        <div class="heroPoints"><span>進行表</span><span>学校別範囲</span><span>宿題・CT</span></div>
      </div>

      <div class="loginCard">
        <div class="roleTabs" role="tablist" aria-label="ログイン種別">
          <button class="roleTab active" data-role="student" role="tab" aria-selected="true">生徒用</button>
          <button class="roleTab" data-role="teacher" role="tab" aria-selected="false">講師用</button>
        </div>
        <div class="devicePrompt">
          <p>この端末はどちらですか？</p>
          <div class="deviceChoices">
            <button class="deviceChoice" data-device="personal"><strong>自分の端末</strong><small>希望時だけログインを記憶</small></button>
            <button class="deviceChoice" data-device="shared"><strong>塾の共用端末</strong><small>情報を端末に残しません</small></button>
          </div>
        </div>
        <form id="loginForm" class="loginForm" autocomplete="off">
          <label><span id="loginIdLabel">生徒ID</span><input id="loginId" inputmode="numeric" autocomplete="username" required></label>
          <label><span>パスワード</span><input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <label id="rememberRow" class="checkRow hidden"><input id="rememberLogin" type="checkbox"><span>この端末でログイン状態を記憶する</span></label>
          <button class="primaryBtn" type="submit">ログイン</button>
          <button id="adminEntry" class="adminEntry" type="button">管理者画面</button>
          <p id="loginMessage" class="formMessage" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="workspace" class="workspace hidden" aria-live="polite">
      <aside class="sideNav">
        <div class="userBadge"><span id="userInitial">F</span><div><strong id="userName">—</strong><small id="userMeta">—</small></div></div>
        <nav id="navItems"></nav>
        <button id="logoutButton" class="textButton danger">ログアウト</button>
      </aside>
      <section class="contentPane">
        <div id="globalStatus" class="statusLine hidden"></div>
        <div id="content"></div>
      </section>
    </section>
  </main>

  <footer class="footer"><span class="footerCopy">© 個別指導Step</span></footer>

  <dialog id="modal" class="modal"><div class="modalFrame"><button id="modalClose" class="modalClose" type="button" aria-label="閉じる">×</button><div id="modalBody"></div></div></dialog>
  <template id="loadingTemplate"><div class="loadingCard"><span class="spinner"></span><p>読み込み中です…</p></div></template>
  <script type="module" src="app.js?v=20260815-teacher-details"></script>
</body>
</html>
